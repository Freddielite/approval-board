<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content approvals</title>
<style>
:root{color-scheme:dark;--bg:#0E0B09;--card:#17120F;--line:rgba(255,255,255,.1);
 --ink:#F6F1EC;--mut:rgba(246,241,236,.56);--ok:#22B465;--warn:#E8A317;--no:#E0453C;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 padding:0 0 128px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
 background:rgba(14,11,9,.92);backdrop-filter:blur(10px);z-index:30}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
 background:rgba(14,11,9,.9);backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);padding:14px 16px}
.top h1{font-size:17px;letter-spacing:-.01em}
.top p{font-size:13px;color:var(--mut);margin-top:2px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.row::-webkit-scrollbar{display:none}
.row button{flex:0 0 auto;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);color:var(--mut);font-size:13px;font-weight:600;
 white-space:nowrap}
.row button[aria-pressed=true]{color:#0E0B09;border-color:transparent;
 background:linear-gradient(135deg,var(--t1,#CB1419),var(--t2,#FFC02E))}
.row button span{opacity:.6;margin-left:6px}
.bar{margin-top:12px;height:6px;border-radius:99px;background:rgba(255,255,255,.1);
 overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.wrap{padding:18px 16px 0}
.folders{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.folders::-webkit-scrollbar{display:none}
.folders button{flex:0 0 auto;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
 background:rgba(255,255,255,.04);color:var(--mut);font-size:13px;font-weight:600;
 white-space:nowrap}
.folders button[aria-pressed=true]{color:var(--ink);border-color:rgba(255,255,255,.3);
 background:rgba(255,255,255,.1)}
.folders button.add{color:var(--ink);border-style:dashed}
.actions{display:flex;gap:10px;align-items:center;margin:16px 0 4px}
.actions .hint{font-size:13px;color:var(--mut);flex:1}
.ghost{padding:10px 14px;border-radius:11px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);font-size:13px;font-weight:600}
.solid{padding:12px 18px;border-radius:12px;border:none;background:var(--ink);color:#0E0B09;
 font-size:14px;font-weight:700}
.grid{display:grid;gap:16px;margin-top:16px}
@media(min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1140px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card[data-verdict=approved]{border-color:rgba(34,180,101,.6)}
.card[data-verdict=changes]{border-color:rgba(232,163,23,.6)}
.card[data-verdict=rejected]{border-color:rgba(224,69,60,.55)}
.card[data-posted="1"]{opacity:.45}
.card[data-posted="1"] .media,.card[data-posted="1"] .cap,
.card[data-posted="1"] .verdict,.card[data-posted="1"] .comment{display:none}
.card[data-posted="1"]::before{content:"POSTED";display:block;background:var(--ok);
 color:#06130B;font:700 12px/1 inherit;letter-spacing:.14em;padding:9px 16px}
body.hideposted .card[data-posted="1"]{display:none}
.media{background:#000;position:relative}
.media video{width:100%;display:block;max-height:74vh;object-fit:contain;background:#000}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{width:100%;flex:0 0 100%;scroll-snap-align:center;display:block}
.counter{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.62);
 border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.flag{background:rgba(232,163,23,.14);color:var(--warn);font-size:12px;padding:8px 12px}
.body{padding:16px}
.title{width:100%;background:transparent;border:none;font-size:17px;font-weight:700;
 letter-spacing:-.01em;padding:0}
.fmt{font-size:13px;color:var(--mut);margin-top:3px}
.cap{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cap summary{font-size:14px;font-weight:600;cursor:pointer}
.cap textarea{width:100%;margin-top:10px;background:rgba(255,255,255,.04);
 border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;line-height:1.5;
 resize:vertical;min-height:120px}
.cap .copy{margin-top:10px}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.verdict button{padding:13px 6px;border-radius:11px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);font-size:14px;font-weight:600}
.verdict button[aria-pressed=true][data-v=approved]{background:var(--ok);border-color:var(--ok);
 color:#06130B}
.verdict button[aria-pressed=true][data-v=changes]{background:var(--warn);
 border-color:var(--warn);color:#180F00}
.verdict button[aria-pressed=true][data-v=rejected]{background:var(--no);border-color:var(--no);
 color:#1B0605}
.comment{width:100%;margin-top:10px;background:rgba(255,255,255,.04);
 border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;
 resize:vertical}
.manage{display:flex;gap:8px;margin-top:10px}
.manage button{flex:1;padding:11px 4px;border-radius:10px;border:1px solid var(--line);
 background:transparent;color:var(--mut);font-size:12.5px;font-weight:600;white-space:nowrap}
.manage .get{color:var(--ink)}
.manage .post{color:var(--ink)}
.empty{color:var(--mut);font-size:14px;padding:22px 2px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:14px 16px;
 padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
 background:rgba(14,11,9,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
 display:flex;gap:10px;align-items:center}
.foot span{font-size:13px;color:var(--mut);flex:1}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);z-index:40;
 background:var(--ink);color:#0E0B09;font:600 14px/1 inherit;padding:12px 18px;
 border-radius:999px;opacity:0;transition:.22s;pointer-events:none;max-width:86vw;
 text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;
 align-items:center;justify-content:center;padding:24px}
.gate div{width:100%;max-width:320px;text-align:center}
.gate h2{font-size:20px;margin-bottom:6px}
.gate p{font-size:14px;color:var(--mut);margin-bottom:18px}
.gate input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);
 border-radius:12px;padding:14px;text-align:center;letter-spacing:.3em;margin-bottom:12px}
.gate button{width:100%}
.busy{position:fixed;inset:0;z-index:45;background:rgba(14,11,9,.7);display:none;
 align-items:center;justify-content:center;font-size:14px}
.busy.on{display:flex}
</style></head><body>

<div class="gate" id="gate"><div>
  <h2>Content approvals</h2>
  <p>Enter the passcode to continue</p>
  <input id="code" type="password" inputmode="numeric" autocomplete="off">
  <button class="solid" id="enter">Enter</button>
</div></div>

<div class="top">
  <h1>Content approvals</h1>
  <p id="sub">Loading…</p>
  <div class="row" id="tabs"></div>
  <div class="bar"><i id="prog"></i></div>
</div>

<div class="wrap">
  <div class="folders" id="folders"></div>
  <div class="actions">
    <span class="hint" id="hint"></span>
    <label class="ghost"><input type="checkbox" id="hidePosted" style="margin-right:6px">
      Hide posted</label>
    <button class="ghost" id="add">+ Add content</button>
  </div>
  <input type="file" id="picker" multiple hidden
    accept="video/*,image/*,.mov,.MOV,.mp4,.m4v,.webm,.avi,.mkv,.png,.jpg,.jpeg,.webp,.heic">
  <div class="grid" id="grid"></div>
</div>

<div class="foot"><span id="tally"></span>
  <button class="solid" id="copy">Copy decisions</button></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy">Working…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL = 'https://saxupxzmgqhnbilhnpxe.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNheHVweHptZ3FobmJpbGhucHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMDAzMDAsImV4cCI6MjExMDU3NjMwMH0.rvRGHiqoh5HTLFMGWCFTkwJIMUjmbCRPqojqvdJVNRU';
var PASSCODE = '2605';
var BUCKET = 'content';
var BRANDS = [
  { name: 'Pot of Food', c1: '#CB1419', c2: '#FFC02E' },
  { name: 'Dexter Cyber Lab', c1: '#1F6FEB', c2: '#58C8FF' },
  { name: 'Open Delta', c1: '#12A45B', c2: '#6BE3A4' }
];

var db = null, brand = BRANDS[0].name, folders = [], folderId = null, items = [];
var el = function (id) { return document.getElementById(id); };

function toast(msg) {
  var t = el('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 2200);
}
function busy(on) {
  var b = el('busy');
  b.classList.toggle('on', !!on);
  b.textContent = typeof on === 'string' ? on : 'Working\u2026';
}
function publicUrl(path) {
  return SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + path;
}
function safeName(s) {
  return String(s || 'content').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 70);
}
function extOf(path) {
  var m = /\.([a-z0-9]+)$/i.exec(path);
  return m ? '.' + m[1].toLowerCase() : '';
}
function pull(path, filename) {
  var a = document.createElement('a');
  a.href = publicUrl(path) + '?download=' + encodeURIComponent(filename);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* ---------- gate ---------- */
function unlock() {
  el('gate').style.display = 'none';
  start();
}
el('enter').addEventListener('click', function () {
  if (el('code').value.trim() === PASSCODE) {
    try { localStorage.setItem('ab:ok', '1'); } catch (e) {}
    unlock();
  } else { toast('Wrong passcode'); }
});
el('code').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') el('enter').click();
});

/* ---------- data ---------- */
function start() {
  if (!window.supabase) { el('sub').textContent = 'Could not load. Check connection.'; return; }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  drawTabs();
  loadFolders();
}

function drawTabs() {
  var t = el('tabs');
  t.innerHTML = '';
  BRANDS.forEach(function (b) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = b.name;
    btn.setAttribute('aria-pressed', String(b.name === brand));
    btn.addEventListener('click', function () {
      brand = b.name; folderId = null;
      try { localStorage.setItem('ab:brand', brand); } catch (e) {}
      drawTabs(); loadFolders();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    if (b.name === brand) {
      t.style.setProperty('--t1', b.c1); t.style.setProperty('--t2', b.c2);
    }
    t.appendChild(btn);
  });
}

function loadFolders() {
  el('sub').textContent = 'Loading…';
  db.from('folders').select('*').eq('brand', brand).order('created_at', { ascending: false })
    .then(function (r) {
      if (r.error) { el('sub').textContent = r.error.message; return; }
      folders = r.data || [];
      if (!folderId || !folders.some(function (f) { return f.id === folderId; })) {
        folderId = folders.length ? folders[0].id : null;
      }
      drawFolders();
      loadItems();
    });
}

function drawFolders() {
  var f = el('folders');
  f.innerHTML = '';
  folders.forEach(function (fo) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = fo.name;
    b.setAttribute('aria-pressed', String(fo.id === folderId));
    b.addEventListener('click', function () { folderId = fo.id; drawFolders(); loadItems(); });
    b.addEventListener('dblclick', function () { removeFolder(fo); });
    f.appendChild(b);
  });
  var add = document.createElement('button');
  add.type = 'button'; add.className = 'add'; add.textContent = '+ New folder';
  add.addEventListener('click', newFolder);
  f.appendChild(add);
  el('hint').textContent = folders.length
    ? 'Double tap a folder to delete it'
    : 'Make a folder for this week to start';
}

function newFolder() {
  var name = prompt('Folder name', 'Week ' + (folders.length + 1));
  if (!name) return;
  busy(true);
  db.from('folders').insert({ brand: brand, name: name.trim() }).select().single()
    .then(function (r) {
      busy(false);
      if (r.error) { toast(r.error.message); return; }
      folderId = r.data.id; loadFolders(); toast('Folder created');
    });
}

function removeFolder(fo) {
  if (!confirm('Delete "' + fo.name + '" and everything in it?')) return;
  busy(true);
  db.from('items').select('paths').eq('folder_id', fo.id).then(function (r) {
    var paths = [];
    (r.data || []).forEach(function (it) { paths = paths.concat(it.paths || []); });
    var step = paths.length ? db.storage.from(BUCKET).remove(paths) : Promise.resolve({});
    return step.then(function () { return db.from('folders').delete().eq('id', fo.id); });
  }).then(function () {
    busy(false); folderId = null; loadFolders(); toast('Folder deleted');
  }).catch(function (e) { busy(false); toast(String(e.message || e)); });
}

function loadItems() {
  if (!folderId) { items = []; drawItems(); el('sub').textContent = brand; return; }
  db.from('items').select('*').eq('folder_id', folderId)
    .order('created_at', { ascending: true })
    .then(function (r) {
      if (r.error) { toast(r.error.message); return; }
      items = r.data || [];
      el('sub').textContent = brand;
      drawItems();
    });
}

/* ---------- uploads ---------- */
el('add').addEventListener('click', function () {
  if (!folderId) { toast('Make a folder first'); return; }
  el('picker').click();
});

var VID = /\.(mov|mp4|m4v|webm|avi|mkv|3gp)$/i;
var IMG = /\.(png|jpe?g|webp|gif|heic|heif)$/i;
function isVideo(f) { return f.type.indexOf('video') === 0 || VID.test(f.name); }
function isImage(f) { return f.type.indexOf('image') === 0 || IMG.test(f.name); }

/* slides of one carousel share a name and end in a number: POF-bulk-1, POF-bulk-2 ... */
function stem(name) { return name.replace(/\.[^.]+$/, ''); }
function groupOf(name) {
  var m = stem(name).match(/^(.*?)[ _.\-]*(\d+)$/);
  return m && m[1] ? { key: m[1], n: parseInt(m[2], 10) } : { key: stem(name), n: 0 };
}

el('picker').addEventListener('change', function (e) {
  var files = [].slice.call(e.target.files);
  e.target.value = '';
  if (!files.length) return;

  var jobs = [];
  files.filter(isVideo)
    .forEach(function (v) { jobs.push({ kind: 'video', title: stem(v.name), files: [v] }); });

  var buckets = {}, order = [];
  files.filter(isImage)
    .forEach(function (img) {
      var g = groupOf(img.name);
      if (!buckets[g.key]) { buckets[g.key] = []; order.push(g.key); }
      buckets[g.key].push({ f: img, n: g.n });
    });
  order.forEach(function (k) {
    var set = buckets[k].sort(function (a, b) { return a.n - b.n; })
      .map(function (x) { return x.f; });
    jobs.push({ kind: 'carousel', title: k, files: set });
  });

  var total = files.length, done = 0;
  busy('Uploading 0 of ' + total + '\u2026');
  var chain = Promise.resolve();
  jobs.forEach(function (job) {
    chain = chain.then(function () {
      return makeItem(job, function () {
        done++; busy('Uploading ' + done + ' of ' + total + '\u2026');
      });
    });
  });
  var movs = files.filter(function (f) { return /\.mov$/i.test(f.name); }).length;
  chain.then(function () {
    busy(false); loadItems();
    if (movs) toast(movs + ' .MOV uploaded \u2014 may not play on Android. Convert to MP4.');
    else toast(jobs.length === 1 ? 'Uploaded' : jobs.length + ' items uploaded');
  }).catch(function (err) { busy(false); toast(String(err.message || err)); });
});

function makeItem(job, tick) {
  var paths = [];
  var chain = Promise.resolve();
  job.files.forEach(function (f) {
    chain = chain.then(function () {
      var path = folderId + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)
        + '-' + f.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
      return db.storage.from(BUCKET).upload(path, f, { contentType: f.type })
        .then(function (r) {
          if (r.error) throw r.error;
          paths.push(path); if (tick) tick();
        });
    });
  });
  return chain.then(function () {
    return db.from('items').insert({
      folder_id: folderId, kind: job.kind, paths: paths, title: job.title
    });
  }).then(function (r) { if (r.error) throw r.error; });
}

/* ---------- items ---------- */
function patch(id, fields) {
  return db.from('items').update(fields).eq('id', id).then(function (r) {
    if (r.error) toast(r.error.message);
  });
}

function drawItems() {
  var g = el('grid');
  g.innerHTML = '';
  if (!folderId) { g.innerHTML = '<p class="empty">No folders yet for ' + esc(brand) + '.</p>'; tally(); return; }
  if (!items.length) { g.innerHTML = '<p class="empty">Nothing in this folder yet.</p>'; tally(); return; }

  items.forEach(function (it) {
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = it.id;
    if (it.verdict) card.dataset.verdict = it.verdict;
    card.dataset.posted = it.posted ? '1' : '0';

    var media = '';
    var paths = it.paths || [];
    if (it.kind === 'video' && paths[0]) {
      media = '<div class="media"><video playsinline preload="metadata" controls src="'
        + esc(publicUrl(paths[0])) + '"></video>'
        + (/\.mov$/i.test(paths[0])
            ? '<p class="flag">.MOV from iPhone \u2014 may not play on Android or Chrome</p>'
            : '')
        + '</div>';
    } else if (paths.length) {
      media = '<div class="media"><div class="strip">'
        + paths.map(function (p) { return '<img loading="lazy" src="' + esc(publicUrl(p)) + '">'; }).join('')
        + '</div><div class="counter"><b>1</b> / ' + paths.length + '</div></div>';
    }

    card.innerHTML = media
      + '<div class="body">'
      + '<input class="title" value="' + esc(it.title) + '">'
      + '<p class="fmt">' + (it.kind === 'video' ? 'Video' : paths.length + ' slides') + '</p>'
      + '<details class="cap"><summary>Caption</summary>'
      + '<textarea placeholder="Write the caption here">' + esc(it.caption) + '</textarea>'
      + '<button class="ghost copy" type="button">Copy caption</button></details>'
      + '<div class="verdict">'
      + '<button type="button" data-v="approved">Approve</button>'
      + '<button type="button" data-v="changes">Changes</button>'
      + '<button type="button" data-v="rejected">Reject</button></div>'
      + '<textarea class="comment" rows="2" placeholder="Note (optional)">' + esc(it.note) + '</textarea>'
      + '<div class="manage"><button type="button" class="get">Download</button>'
      + '<button type="button" class="post">'
      + (it.posted ? 'Undo posted' : 'Mark as posted') + '</button>'
      + '<button type="button" class="drop">Delete</button></div>'
      + '</div>';

    card.querySelectorAll('.verdict button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(it.verdict === b.dataset.v));
      b.addEventListener('click', function () {
        var v = it.verdict === b.dataset.v ? null : b.dataset.v;
        it.verdict = v;
        if (v) card.dataset.verdict = v; else card.removeAttribute('data-verdict');
        card.querySelectorAll('.verdict button').forEach(function (o) {
          o.setAttribute('aria-pressed', String(o.dataset.v === v));
        });
        patch(it.id, { verdict: v }); tally();
      });
    });

    var t = card.querySelector('.title');
    t.addEventListener('change', function () {
      it.title = t.value.trim(); patch(it.id, { title: it.title });
    });
    var capBox = card.querySelector('.cap textarea');
    capBox.addEventListener('change', function () {
      it.caption = capBox.value; patch(it.id, { caption: it.caption }); toast('Caption saved');
    });
    card.querySelector('.cap .copy').addEventListener('click', function () {
      copy(capBox.value, 'Caption copied');
    });
    var note = card.querySelector('.comment');
    note.addEventListener('change', function () {
      it.note = note.value.trim(); patch(it.id, { note: it.note });
    });
    card.querySelector('.get').addEventListener('click', function () {
      if (!paths.length) { toast('Nothing to download'); return; }
      var base = safeName(it.title);
      if (paths.length === 1) {
        pull(paths[0], base + extOf(paths[0]));
        toast('Downloading');
        return;
      }
      /* browsers block a burst of downloads, so they go one at a time */
      toast('Downloading ' + paths.length + ' slides');
      paths.forEach(function (p, i) {
        setTimeout(function () {
          pull(p, base + ' ' + (i + 1) + extOf(p));
        }, i * 900);
      });
    });

    var post = card.querySelector('.post');
    post.addEventListener('click', function () {
      it.posted = !it.posted;
      card.dataset.posted = it.posted ? '1' : '0';
      post.textContent = it.posted ? 'Undo posted' : 'Mark as posted';
      patch(it.id, { posted: it.posted }); tally();
    });
    card.querySelector('.drop').addEventListener('click', function () {
      if (!confirm('Delete this item?')) return;
      busy(true);
      var step = paths.length ? db.storage.from(BUCKET).remove(paths) : Promise.resolve({});
      step.then(function () { return db.from('items').delete().eq('id', it.id); })
        .then(function () { busy(false); loadItems(); toast('Deleted'); })
        .catch(function (e) { busy(false); toast(String(e.message || e)); });
    });

    var strip = card.querySelector('.strip');
    if (strip) {
      var out = card.querySelector('.counter b');
      strip.addEventListener('scroll', function () {
        out.textContent = Math.min(
          Math.round(strip.scrollLeft / strip.clientWidth) + 1, paths.length);
      }, { passive: true });
    }

    g.appendChild(card);
  });
  tally();
}

/* ---------- tally and copy ---------- */
function tally() {
  var live = items;
  var done = 0, ok = 0, posted = 0;
  live.forEach(function (it) {
    if (it.verdict) { done++; if (it.verdict === 'approved') ok++; }
    if (it.posted) posted++;
  });
  el('prog').style.width = (live.length ? done / live.length * 100 : 0) + '%';
  el('tally').textContent = live.length
    ? done + ' of ' + live.length + ' decided \u00b7 ' + ok + ' approved \u00b7 ' + posted + ' posted'
    : 'Nothing to review';
}

function copy(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast(msg); },
      function () { fallback(text, msg); });
  } else fallback(text, msg);
}
function fallback(text, msg) {
  var a = document.createElement('textarea');
  a.value = text; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select(); a.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); toast(msg); } catch (e) { toast('Copy failed'); }
  document.body.removeChild(a);
}

el('copy').addEventListener('click', function () {
  var folder = folders.filter(function (f) { return f.id === folderId; })[0];
  var lines = [brand + (folder ? ' \u2014 ' + folder.name : ''), ''];
  items.forEach(function (it) {
    var v = it.posted ? 'POSTED' : (it.verdict ? it.verdict.toUpperCase() : 'NOT DECIDED');
    lines.push('\u2022 ' + (it.title || 'Untitled') + ' \u2014 ' + v
      + (it.note ? ' (' + it.note + ')' : ''));
  });
  copy(lines.join('\n'), 'Decisions copied');
});

el('hidePosted').addEventListener('change', function (e) {
  document.body.classList.toggle('hideposted', e.target.checked);
});

/* ---------- boot ---------- */
try {
  var savedBrand = localStorage.getItem('ab:brand');
  if (savedBrand && BRANDS.some(function (b) { return b.name === savedBrand; })) brand = savedBrand;
  if (localStorage.getItem('ab:ok')) unlock();
} catch (e) {}
</script></body></html>
