<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0E0B09;--card:#17120F;--line:rgba(255,255,255,.1);
 --ink:#F6F1EC;--mut:rgba(246,241,236,.56);--ok:#22B465;--warn:#E8A317;--no:#E0453C;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 padding:0 0 128px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
 background:rgba(14,11,9,.92);backdrop-filter:blur(10px);z-index:30}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
 background:rgba(14,11,9,.9);backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);padding:14px 16px}
.top h1{font-size:17px;letter-spacing:-.01em}
.top p{font-size:13px;color:var(--mut);margin-top:2px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.row::-webkit-scrollbar{display:none}
.row button{flex:0 0 auto;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);color:var(--mut);font-size:13px;font-weight:600;
 white-space:nowrap}
.row button[aria-pressed=true]{color:#0E0B09;border-color:transparent;
 background:linear-gradient(135deg,var(--t1,#CB1419),var(--t2,#FFC02E))}
.row button span{opacity:.6;margin-left:6px}
.bar{margin-top:12px;height:6px;border-radius:99px;background:rgba(255,255,255,.1);
 overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.wrap{padding:18px 16px 0}
.folders{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.folders::-webkit-scrollbar{display:none}
.folders button{flex:0 0 auto;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
 background:rgba(255,255,255,.04);color:var(--mut);font-size:13px;font-weight:600;
 white-space:nowrap}
.folders button[aria-pressed=true]{color:var(--ink);border-color:rgba(255,255,255,.3);
 background:rgba(255,255,255,.1)}
.folders button.add{color:var(--ink);border-style:dashed}
.actions{display:flex;gap:10px;align-items:center;margin:16px 0 4px}
.actions .hint{font-size:13px;color:var(--mut);flex:1}
.ghost{padding:10px 14px;border-radius:11px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);font-size:13px;font-weight:600}
.solid{padding:12px 18px;border-radius:12px;border:none;background:var(--ink);color:#0E0B09;
 font-size:14px;font-weight:700}
.grid{display:grid;gap:16px;margin-top:16px}
@media(min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1140px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
 transition:border-color .35s,opacity .35s}
.card[data-verdict=approved]{border-color:rgba(34,180,101,.6)}
.card[data-verdict=changes]{border-color:rgba(232,163,23,.6)}
.card[data-verdict=rejected]{border-color:rgba(224,69,60,.55)}
.card[data-posted="1"]{opacity:.45}
.card[data-posted="1"] .media,.card[data-posted="1"] .cap,
.card[data-posted="1"] .verdict,.card[data-posted="1"] .comment{display:none}
.card[data-posted="1"]::before{content:"POSTED";display:block;background:var(--ok);
 color:#06130B;font:700 12px/1 inherit;letter-spacing:.14em;padding:9px 16px}
body.hideposted .card[data-posted="1"]{display:none}
.media{background:#000;position:relative}
.media video{width:100%;display:block;max-height:74vh;object-fit:contain;background:#000}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{width:100%;flex:0 0 100%;scroll-snap-align:center;display:block}
.counter{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.62);
 border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.flag{background:rgba(232,163,23,.14);color:var(--warn);font-size:12px;padding:8px 12px}
.body{padding:16px}
.tag{display:inline-block;background:linear-gradient(135deg,var(--g1),var(--g2));
 color:#120B06;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
 padding:5px 11px;border-radius:999px;margin:0 8px 9px 0}
.dayset{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;
 padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:9px;
 text-transform:uppercase;color:var(--ink)}
.dayset::after{content:" \25BE";opacity:.6}
.title{width:100%;background:transparent;border:none;font-size:17px;font-weight:700;
 letter-spacing:-.01em;padding:0}
.fmt{font-size:13px;color:var(--mut);margin-top:3px}
.cap{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cap summary{font-size:14px;font-weight:600;cursor:pointer}
.cap textarea{width:100%;margin-top:10px;background:rgba(255,255,255,.04);
 border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;line-height:1.5;
 resize:vertical;min-height:120px}
.cap .copy{margin-top:10px}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.verdict button{padding:13px 4px;border-radius:11px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);font-size:14px;font-weight:600;line-height:1.2}
.verdict button[aria-pressed=true]{font-weight:800}
.verdict button[aria-pressed=true][data-v=approved]{background:var(--ok);border-color:var(--ok);
 color:#06130B}
.verdict button[aria-pressed=true][data-v=changes]{background:var(--warn);
 border-color:var(--warn);color:#180F00}
.verdict button[aria-pressed=true][data-v=rejected]{background:var(--no);border-color:var(--no);
 color:#1B0605}
.comment{width:100%;margin-top:10px;background:rgba(255,255,255,.04);
 border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;
 resize:vertical}
.manage{display:flex;gap:8px;margin-top:10px}
.manage button{flex:1;padding:11px 4px;border-radius:10px;border:1px solid var(--line);
 background:transparent;color:var(--mut);font-size:12.5px;font-weight:600;white-space:nowrap}
.manage .get{color:var(--ink)}
.manage .post{color:var(--ink)}
.empty{color:var(--mut);font-size:14px;padding:22px 2px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:14px 16px;
 padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
 background:rgba(14,11,9,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
 display:flex;gap:10px;align-items:center}
.foot span{font-size:13px;color:var(--mut);flex:1}
.resume{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;
 border:1px solid rgba(232,163,23,.4);background:rgba(232,163,23,.1);border-radius:13px}
.resume span{flex:1;font-size:13px;color:var(--warn)}
.work{position:fixed;left:16px;right:16px;bottom:96px;z-index:28;background:var(--card);
 border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:none}
.work.on{display:block}
.work b{display:block;font-size:13px;font-weight:600}
.work i{display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.12);
 margin-top:9px;overflow:hidden}
.work i u{display:block;height:100%;width:0;background:var(--warn);transition:width .2s}
.flag.ok{background:rgba(34,180,101,.14);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);z-index:40;
 background:var(--ink);color:#0E0B09;font:600 14px/1 inherit;padding:12px 18px;
 border-radius:999px;opacity:0;transition:opacity .2s,transform .38s var(--spring);pointer-events:none;max-width:86vw;
 text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;
 align-items:center;justify-content:center;padding:24px}
.gate div{width:100%;max-width:320px;text-align:center}
.gate h2{font-size:20px;margin-bottom:6px}
.gate p{font-size:14px;color:var(--mut);margin-bottom:18px}
.gate input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);
 border-radius:12px;padding:14px;text-align:center;letter-spacing:.3em;margin-bottom:12px}
.gate button{width:100%}
.sheet{position:fixed;inset:0;z-index:48;background:rgba(0,0,0,.6);display:none;
 align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;
 padding:20px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:620px){.sheet{align-items:center}
 .panel{border-radius:20px;max-height:80vh}}
.panel h3{font-size:18px}
.panel .sub{font-size:13px;color:var(--mut);margin-top:3px}
.rows{overflow-y:auto;margin:14px 0;flex:1}
.rw{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.rw b{display:block;font-size:14px;font-weight:700;word-break:break-word}
.rw small{color:var(--mut);font-size:12px}
.rw .picks{display:flex;gap:8px;margin-top:10px}
.rw .pick{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);
 border-radius:10px;padding:11px 10px;font-size:13px;text-align:left;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.rw .pick::after{content:" \25BE";opacity:.6}
.sheetfoot{display:flex;gap:10px}
.sheetfoot button{flex:1}
.day{display:inline-block;background:rgba(255,255,255,.1);color:var(--ink);font-size:11px;
 font-weight:700;letter-spacing:.1em;padding:4px 9px;border-radius:999px;margin-bottom:8px}
.pop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:none;
 align-items:flex-end;justify-content:center;opacity:0;transition:opacity .16s}
.pop.on{display:flex}
.pop.show{opacity:1}
.popcard{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);
 border-radius:20px 20px 0 0;padding:18px 16px;
 padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
 max-height:80vh;overflow-y:auto;transform:translateY(48px);transition:transform .16s ease-in}
.pop.show .popcard{transform:none;transition:transform .38s var(--spring)}
@media(min-width:620px){.pop{align-items:center}.popcard{border-radius:20px;transform:scale(.94)}}
.popcard h4{font-size:17px}
.popcard .msg{font-size:14px;color:var(--mut);margin-top:6px}
.popcard input{width:100%;margin-top:14px;background:rgba(255,255,255,.05);
 border:1px solid var(--line);border-radius:12px;padding:13px}
.opts{margin-top:14px}
.opts button{display:flex;align-items:center;justify-content:space-between;width:100%;
 text-align:left;padding:14px;border-radius:12px;border:1px solid transparent;
 background:transparent;font-size:15px}
.opts button:hover{background:rgba(255,255,255,.05)}
.opts button[aria-selected=true]{background:rgba(255,255,255,.09);
 border-color:rgba(255,255,255,.18);font-weight:700}
.opts button i{font-style:normal;color:var(--ok)}
.popfoot{display:flex;gap:10px;margin-top:16px}
.popfoot button{flex:1}
.danger{background:var(--no);color:#fff;border:none;padding:12px 18px;border-radius:12px;
 font-size:14px;font-weight:700}
.busy{position:fixed;inset:0;z-index:45;background:rgba(14,11,9,.7);display:none;
 align-items:center;justify-content:center;font-size:14px}
.busy.on{display:flex}

:root{--spring:cubic-bezier(.2,1.15,.3,1);--out:cubic-bezier(.2,.8,.2,1)}
button{transition:transform .12s var(--out),background-color .2s,border-color .2s,color .2s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row button[aria-pressed=true]{animation:tabpop .34s var(--spring)}
@keyframes tabpop{0%{transform:scale(.9)}100%{transform:scale(1)}}

/* the rubber stamp */
.stamp{position:absolute;top:16px;right:16px;z-index:4;pointer-events:none;transform:rotate(var(--r,-8deg));
 filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}
.stamp b{display:block;padding:3px;border:2.5px solid currentColor;border-radius:9px;
 -webkit-mask-image:var(--inkmask);mask-image:var(--inkmask);
 -webkit-mask-size:280% 280%;mask-size:280% 280%;
 -webkit-mask-position:var(--mx,30%) var(--my,60%);mask-position:var(--mx,30%) var(--my,60%)}
.stamp i{display:block;font:400 29px/1 Anton,Impact,"Arial Black",sans-serif;font-style:normal;
 letter-spacing:.07em;text-transform:uppercase;padding:7px 13px 6px;
 border:4px solid currentColor;border-radius:6px}
.stamp[data-v=approved]{color:#35D683}
.stamp[data-v=changes]{color:#F2A81E}
.stamp[data-v=rejected]{color:#FF5A4F}
.card[data-posted="1"] .stamp{display:none}
.stamp.slam{animation:slam .4s cubic-bezier(.3,.9,.35,1.1) both}
@keyframes slam{
 0%{transform:translateY(-22px) rotate(calc(var(--r,-8deg) - 10deg)) scale(2.7);opacity:0}
 60%{transform:rotate(calc(var(--r,-8deg) + 1.5deg)) scale(.9);opacity:1}
 100%{transform:rotate(var(--r,-8deg)) scale(1);opacity:1}}
.stamp.lift{animation:lift .26s ease-in both}
@keyframes lift{to{transform:translateY(-28px) rotate(calc(var(--r,-8deg) - 5deg)) scale(1.18);opacity:0}}
.splat{position:absolute;z-index:3;pointer-events:none;width:130px;height:130px;margin:-65px 0 0 -65px;
 border-radius:50%;border:3px solid currentColor;animation:splat .5s ease-out both}
@keyframes splat{0%{transform:scale(.3);opacity:.75}100%{transform:scale(1.9);opacity:0}}

/* loading placeholders */
.skel{border-radius:18px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.skel i{display:block;background:linear-gradient(90deg,rgba(255,255,255,.035) 30%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.035) 70%);
 background-size:250% 100%;animation:shimmer 1.3s linear infinite}
.skel .m{aspect-ratio:4/5;max-height:52vh}
.skel .l{height:16px;margin:18px 16px 10px;border-radius:6px;width:58%}
.skel .s{height:12px;margin:0 16px;border-radius:6px;width:28%}
.skel .v{height:46px;margin:18px 16px 16px;border-radius:11px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}

/* cards arriving after a tab or folder change */
.grid.enter>*{animation:rise .44s var(--out) both;animation-delay:calc(var(--i,0) * 45ms)}
.grid.enter.fromR>*{animation-name:fromR}
.grid.enter.fromL>*{animation-name:fromL}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fromR{from{opacity:0;transform:translateX(32px)}}
@keyframes fromL{from{opacity:0;transform:translateX(-32px)}}

/* after the entrance rules so these win */
.card.thud{animation:thud .36s ease-out}
@keyframes thud{0%{transform:none}22%{transform:scale(.982) translate(-2px,2px)}
 48%{transform:scale(.992) translate(2px,-1px)}74%{transform:translate(-1px,1px)}100%{transform:none}}
.card.gone{animation:gone .26s ease-in both}
@keyframes gone{to{opacity:0;transform:scale(.95)}}

.sheet.on{animation:fade .2s both}
.sheet.on .panel{animation:up .42s var(--spring) both}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:.4}}

.gate{transition:opacity .28s}
.gate.out{opacity:0;pointer-events:none}
.gate input.no{animation:no .4s}
@keyframes no{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.update{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:29;
 max-width:520px;margin:0 auto;display:none;align-items:center;gap:12px;padding:10px 10px 10px 16px;
 background:var(--card);border:1px solid rgba(255,255,255,.18);border-radius:14px}
.update.on{display:flex;animation:up .42s var(--spring) both}
.update span{flex:1;font-size:13px}
.update .solid{padding:9px 14px;font-size:13px}
#hidePosted{-webkit-appearance:none;appearance:none;width:30px;height:18px;border-radius:99px;
 background:rgba(255,255,255,.2);position:relative;vertical-align:-4px;margin-right:8px;
 transition:background-color .2s;cursor:pointer}
#hidePosted::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
 background:var(--ink);transition:transform .26s var(--spring)}
#hidePosted:checked{background:var(--ok)}
#hidePosted:checked::after{transform:translateX(12px)}
label.ghost{cursor:pointer;display:inline-flex;align-items:center}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;
  animation-iteration-count:1!important;transition-duration:.01ms!important}
 .stamp.slam{animation:fadein .25s both!important}
 @keyframes fadein{from{opacity:0}}
}
</style></head><body>

<div class="gate" id="gate"><div>
  <h2>Content approvals</h2>
  <p>Enter the passcode to continue</p>
  <input id="code" type="password" inputmode="numeric" autocomplete="off">
  <button class="solid" id="enter">Enter</button>
</div></div>

<div class="top">
  <h1>Content approvals</h1>
  <p id="sub">Loading…</p>
  <div class="row" id="tabs"></div>
  <div class="bar"><i id="prog"></i></div>
</div>

<div class="wrap">
  <div class="folders" id="folders"></div>
  <div class="actions">
    <span class="hint" id="hint"></span>
    <label class="ghost"><input type="checkbox" id="hidePosted">
      Hide posted</label>
    <button class="ghost" id="add">+ Add content</button>
  </div>
  <input type="file" id="picker" multiple hidden
    accept="video/*,image/*,.mov,.MOV,.mp4,.m4v,.webm,.avi,.mkv,.png,.jpg,.jpeg,.webp,.heic">
  <div class="grid" id="grid"></div>
</div>

<div class="foot"><span id="tally"></span>
  <button class="solid" id="copy">Copy decisions</button></div>
<div class="sheet" id="sheet"><div class="panel">
  <h3>Before uploading</h3>
  <p class="sub">Set the brand and the day for each one</p>
  <div class="rows" id="rows"></div>
  <div class="sheetfoot">
    <button class="ghost" id="cancel">Cancel</button>
    <button class="solid" id="go">Upload</button>
  </div>
</div></div>
<div class="work" id="work"><b id="worktitle"></b><i id="workbar"><u></u></i></div>
<div class="pop" id="pop"><div class="popcard" id="popcard"></div></div>
<div class="update" id="update"><span>A new version of the board is ready</span>
  <button class="solid" id="updateGo" type="button">Refresh</button></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy">Working…</div>

    buckets[g.key].push({ f: img, n: g.n });
  });
  order.forEach(function (k) {
    pending.push({ kind: 'carousel', title: k,
      files: buckets[k].sort(function (a, b) { return a.n - b.n; })
        .map(function (x) { return x.f; }) });
  });

  openSheet();
});

var pending = [];

function openSheet() {
  var rows = el('rows');
  rows.innerHTML = '';
  var inbox = brand === INBOX;
  el('sheet').querySelector('.sub').textContent = 'Which brand is each one for?';
  pending.forEach(function (job, i) {
    job.brand = inbox ? BRANDS[0].name : brand;
    job.day = inbox ? null : DAYS[i % 7];
    var r = document.createElement('div');
    r.className = 'rw';
    r.innerHTML = '<b>' + esc(job.title) + '</b><small>'
      + (job.kind === 'video' ? 'Video' : job.files.length + ' slides')
      + '</small><div class="picks">'
      + '<button type="button" class="pick b">' + esc(job.brand) + '</button>'
      + '<button type="button" class="pick d">' + esc(job.day || 'No day')
      + '</button></div>';
    var bb = r.querySelector('.b'), dd = r.querySelector('.d');
    bb.addEventListener('click', function () {
      choose('Brand', BRANDS.map(function (x) {
        return { label: x.name, value: x.name }; }), job.brand).then(function (v) {
        if (v === null) return;
        job.brand = v; bb.textContent = v;
      });
    });
    dd.addEventListener('click', function () {
      var opts = [{ label: 'No day', value: '' }].concat(DAYS.map(function (d) {
        return { label: d, value: d }; }));
      choose('Day to post', opts, job.day || '').then(function (v) {
        if (v === null) return;
        job.day = v || null; dd.textContent = v || 'No day';
      });
    });
    rows.appendChild(r);
  });
  el('sheet').classList.add('on');
}

el('cancel').addEventListener('click', function () {
  pending = []; el('sheet').classList.remove('on');
});

el('go').addEventListener('click', function () {
  el('sheet').classList.remove('on');
  var jobs = pending.slice();
  pending = [];
  send(jobs);
});

function send(jobs) {
  if (!jobs.length) return;
  var folderName = (folders.filter(function (f) { return f.id === folderId; })[0] || {}).name
    || INBOX;
  var total = jobs.reduce(function (n, j) { return n + j.files.length; }, 0), done = 0;
  busy('Uploading 0 of ' + total + '\u2026');

  var chain = Promise.resolve();
  jobs.forEach(function (job) {
    chain = chain.then(function () {
      var home = (brand === INBOX)
        ? folderFor(INBOX, INBOX)
        : folderFor(job.brand, folderName);
      return home.then(function (fid) {
        return makeItem(job, fid, function () {
          done++; busy('Uploading ' + done + ' of ' + total + '\u2026');
        });
      });
    });
  });

  var movs = jobs.reduce(function (n, j) {
    return n + j.files.filter(function (f) { return /\.mov$/i.test(f.name); }).length; }, 0);
  chain.then(function () {
    busy(false); loadFolders();
    var elsewhere = (brand === INBOX) ? 0
      : jobs.filter(function (j) { return j.brand !== brand; }).length;
    if (movs) toast(movs + ' .MOV uploaded. Preview works on iPhone only.');
    else if (elsewhere) toast(jobs.length + ' uploaded \u00b7 ' + elsewhere + ' sent to other brands');
    else toast(jobs.length === 1 ? 'Uploaded' : jobs.length + ' items uploaded');
  }).catch(function (err) { busy(false); toast(String(err.message || err)); });
}

/* each brand keeps its own copy of a week, made on demand */
function folderFor(targetBrand, name) {
  if (targetBrand === brand && folderId) return Promise.resolve(folderId);
  return db.from('folders').select('*').eq('brand', targetBrand).eq('name', name)
    .order('created_at', { ascending: true })
    .then(function (r) {
      if (r.data && r.data.length) return r.data[0].id;
      return db.from('folders').insert({ brand: targetBrand, name: name }).select().single()
        .then(function (ins) {
          if (ins.error) throw ins.error;
          return ins.data.id;
        });
    });
}

function makeItem(job, fid, tick) {
  var paths = [];
  var chain = Promise.resolve();
  job.files.forEach(function (f) {
    chain = chain.then(function () {
      var path = fid + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)
        + '-' + f.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
      return db.storage.from(BUCKET).upload(path, f, { contentType: f.type })
        .then(function (r) {
          if (r.error) throw r.error;
          paths.push(path); if (tick) tick();
        });
    });
  });
  return chain.then(function () {
    return db.from('items').insert({
      folder_id: fid, kind: job.kind, paths: paths, title: job.title,
      day: job.day || null, tag: job.brand || null
    }).select().single();
  }).then(function (r) {
    if (r.error) throw r.error;
    if (job.kind === 'video' && job.files[0]) {
      return wantsProxy(job.files[0]).then(function (yes) {
        if (yes) queueProxy(r.data.id, fid, job.files[0], paths);
      });
    }
  });
}

/* ---------- light preview, built in the browser ---------- */
window.addEventListener('beforeunload', function (e) {
  if (working || queue.length) { e.preventDefault(); e.returnValue = ''; return ''; }
});

var FF = {
  lib: 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js',
  util: 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.js',
  core: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
  wasm: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'
};
var ff = null, ffLoading = null, queue = [], working = false;

function twice(fn, label, inst, scratch) {
  return fn().catch(function (err) {
    console.warn('retrying ' + label, err);
    work('Retrying ' + label, 0);
    if (inst && scratch) { try { inst.deleteFile(scratch); } catch (e) {} }
    return new Promise(function (r) { setTimeout(r, 1200); }).then(fn);
  });
}

/* a truncated encode is small and useless, so it never reaches storage */
function sane(out, label) {
  if (!out || !out.buffer || out.buffer.byteLength < 20000) {
    throw new Error(label + ' came out empty');
  }
  return out;
}

function script(src) {
  return new Promise(function (res, rej) {
    var t = document.createElement('script');
    t.src = src; t.onload = res; t.onerror = function () { rej(new Error('load failed')); };
    document.head.appendChild(t);
  });
}

function getFF() {
  if (ff) return Promise.resolve(ff);
  if (ffLoading) return ffLoading;
  work('Getting the converter ready', 0);
  ffLoading = script(FF.lib)
    .then(function () { return script(FF.util); })
    .then(function () {
      var inst = new window.FFmpegWASM.FFmpeg();
      inst.on('progress', function (p) {
        if (p && typeof p.progress === 'number') work(null, Math.min(p.progress, 1));
      });
      return window.FFmpegUtil.toBlobURL(FF.core, 'text/javascript').then(function (core) {
        return window.FFmpegUtil.toBlobURL(FF.wasm, 'application/wasm').then(function (wasm) {
          return inst.load({ coreURL: core, wasmURL: wasm }).then(function () {
            ff = inst; return ff;
          });
        });
      });
    });
  return ffLoading;
}

function work(label, frac) {
  var box = el('work');
  if (label === false) { box.classList.remove('on'); return; }
  box.classList.add('on');
  if (label) el('worktitle').textContent = label;
  if (typeof frac === 'number') {
    el('workbar').firstChild.style.width = Math.round(frac * 100) + '%';
  }
}

/* only a file the browser cannot play, or a very big one, is worth converting */
function wantsProxy(file) {
  if (/\.mov$/i.test(file.name)) return Promise.resolve(true);
  if (file.size < 60 * 1024 * 1024) return Promise.resolve(false);
  return playable(file);
}

/* ask the browser directly instead of guessing from the name */
function playable(file) {
  return new Promise(function (res) {
    var v = document.createElement('video');
    var url = URL.createObjectURL(file);
    var settled = false;
    function done(ok) {
      if (settled) return;
      settled = true; URL.revokeObjectURL(url); res(!ok);
    }
    v.preload = 'metadata';
    v.onloadedmetadata = function () { done(true); };
    v.onerror = function () { done(false); };
    setTimeout(function () { done(true); }, 4000);
    v.src = url;
  });
}

function queueProxy(itemId, fid, file, paths) {
  queue.push({ id: itemId, fid: fid, file: file, paths: paths });
  runQueue();
}

function runQueue() {
  if (working || !queue.length) return;
  working = true;
  var job = queue.shift();
  var left = queue.length ? ' (' + (queue.length + 1) + ' left)' : '';
  var isMov = /\.mov$/i.test(job.file.name);
  var inName = 'in' + (isMov ? '.mov' : '.mp4');
  var fields = {}, oldPath = job.paths[0];

  getFF().then(function (inst) {
    return window.FFmpegUtil.fetchFile(job.file).then(function (data) {
      return inst.writeFile(inName, data);
    }).then(function () {
      /* the small copy first, so the board is usable while the big one runs */
      work('Making preview' + left, 0);
      return twice(function () {
      return inst.exec(['-y', '-i', inName, '-vf', 'scale=-2:480', '-c:v', 'libx264',
        '-profile:v', 'baseline', '-level', '3.1', '-preset', 'veryfast', '-crf', '30',
        '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '64k',
        '-movflags', '+faststart', 'out.mp4'])
        .then(function () { return inst.readFile('out.mp4'); })
        .then(function (out) {
          sane(out, 'Preview');
          var blob = new Blob([out.buffer], { type: 'video/mp4' });
          var path = job.fid + '/' + job.id + '-preview.mp4';
          return db.storage.from(BUCKET).upload(path, blob,
            { contentType: 'video/mp4', upsert: true }).then(function (r) {
            if (r.error) throw r.error;
            fields.preview = path;
            inst.deleteFile('out.mp4').catch(function () {});
            return db.from('items').update({ preview: path }).eq('id', job.id)
              .then(function () { loadItems(); });
          });
        }); }, 'preview', inst, 'out.mp4');
    }).then(function () {
      /* then H.264 at full size, which is the format every app accepts */
      if (!isMov) return null;
      work('Converting to MP4' + left, 0);
      return twice(function () {
      return inst.exec(['-y', '-i', inName, '-c:v', 'libx264', '-profile:v', 'high',
        '-level', '4.2', '-preset', 'faster', '-crf', '20', '-pix_fmt', 'yuv420p',
        '-tag:v', 'avc1', '-c:a', 'aac', '-b:a', '160k',
        '-movflags', '+faststart', 'full.mp4'])
        .then(function () { return inst.readFile('full.mp4'); })
        .then(function (out) {
          sane(out, 'MP4');
          if (out.buffer.byteLength > 48 * 1024 * 1024) {
            work('Still a bit large, trimming it down', 0);
            return inst.exec(['-y', '-i', inName, '-c:v', 'libx264', '-profile:v', 'high',
              '-level', '4.2', '-preset', 'faster', '-crf', '23', '-pix_fmt', 'yuv420p',
              '-tag:v', 'avc1', '-c:a', 'aac', '-b:a', '160k',
              '-movflags', '+faststart', 'full.mp4'])
              .then(function () { return inst.readFile('full.mp4'); })
              .then(function (second) { return sane(second, 'MP4'); });
          }
          return out;
        })
        .then(function (out) {
          var blob = new Blob([out.buffer], { type: 'video/mp4' });
          var path = job.fid + '/' + job.id + '-full.mp4';
          work('Saving MP4', 1);
          return db.storage.from(BUCKET).upload(path, blob,
            { contentType: 'video/mp4', upsert: true }).then(function (r) {
            if (r.error) throw r.error;
            fields.paths = [path];
            inst.deleteFile('full.mp4').catch(function () {});
          });
        }); }, 'conversion', inst, 'full.mp4');
    }).then(function () {
      inst.deleteFile(inName).catch(function () {});
      if (!fields.paths) return null;
      return db.from('items').update({ paths: fields.paths }).eq('id', job.id);
    }).then(function () {
      if (fields.paths && oldPath) return db.storage.from(BUCKET).remove([oldPath]);
    }).then(function () { loadItems(); });
  }).catch(function (err) {
    console.error(err);
    var why = (err && (err.message || err.name)) || 'unknown reason';
    if (/load failed|Failed to fetch|NetworkError/i.test(why)) {
      why = 'could not download the converter';
    } else if (/memory|allocat/i.test(why)) {
      why = 'the phone ran out of memory';
    }
    toast('Could not make a preview (' + why + '). The video itself is fine and already saved.');
  }).then(function () {
    working = false;
    if (queue.length) runQueue();
    else { work(false); if (live.missed) refresh(); }
  });
}

/* work left half done is found again on the next visit */
function unfinished() {
  return items.filter(function (it) {
    if (it.kind !== 'video' || !it.paths || !it.paths[0]) return false;
    if (queue.some(function (q) { return q.id === it.id; })) return false;
    return /\.mov$/i.test(it.paths[0]);
  });
}

function drawResume() {
  var old = el('resume');
  if (old) old.remove();
  var left = unfinished();
  if (!left.length || working) return;
  var bar = document.createElement('div');
  bar.id = 'resume';
  bar.className = 'resume';
  bar.innerHTML = '<span>' + left.length +
    (left.length === 1 ? ' video still needs converting' : ' videos still need converting') +
    '</span><button class="ghost" type="button">Finish them</button>';
  bar.querySelector('button').addEventListener('click', function () {
    bar.remove(); resume(left);
  });
  el('grid').before(bar);
}

function resume(list) {
  work('Fetching ' + list.length + ' file' + (list.length > 1 ? 's' : ''), 0);
  var chain = Promise.resolve();
  list.forEach(function (it) {
    chain = chain.then(function () {
      return db.storage.from(BUCKET).download(it.paths[0]).then(function (r) {
        if (r.error || !r.data) throw (r.error || new Error('download failed'));
        var name = /\.mov$/i.test(it.paths[0]) ? 'resume.mov' : 'resume.mp4';
        var f = new File([r.data], name, { type: r.data.type || 'video/mp4' });
        queueProxy(it.id, it.folder_id, f, it.paths);
      });
    });
  });
  chain.catch(function (e) { toast('Could not fetch: ' + (e.message || e)); work(false); });
}

/* ---------- items ---------- */
function patch(id, fields) {
  return db.from('items').update(fields).eq('id', id).then(function (r) {
    if (r.error) toast(r.error.message);
  });
}

function brandColour(name, i) {
  var b = BRANDS.filter(function (x) { return x.name === name; })[0];
  return b ? (i ? b.c2 : b.c1) : '#6E56CF';
}

function byDay(a, b) {
  if (brand === INBOX) {
    var ta = a.tag || 'zz', tb = b.tag || 'zz';
    if (ta !== tb) return ta.localeCompare(tb);
  }
  var ia = a.day ? DAYS.indexOf(a.day) : 99, ib = b.day ? DAYS.indexOf(b.day) : 99;
  if (ia !== ib) return ia - ib;
  return String(a.created_at).localeCompare(String(b.created_at));
}

function drawItems() {
  var g = el('grid');
  var typing = document.activeElement;
  if (typing && g.contains(typing) &&
      (typing.tagName === 'TEXTAREA' || typing.tagName === 'INPUT')) {
    live.drawPending = true;   /* drawn once they leave the box */
    return;   /* someone is mid sentence, leave the page alone */
  }
  g.innerHTML = '';
  g.classList.remove('enter', 'fromL', 'fromR');
  var anim = navAnim; navAnim = null;
  if (anim && !REDUCE) {
    requestAnimationFrame(function () {
      Array.prototype.forEach.call(g.children, function (c, i) { c.style.setProperty('--i', Math.min(i, 8)); });
      g.classList.add('enter');
      if (anim !== 'up') g.classList.add(anim);
      clearTimeout(g._enter);
      g._enter = setTimeout(function () { g.classList.remove('enter', 'fromL', 'fromR'); }, 1000);
    });
  }
  if (!folderId) { g.innerHTML = '<p class="empty">No folders yet for ' + esc(brand) + '.</p>'; tally(); return; }
  if (!items.length) { g.innerHTML = '<p class="empty">Nothing in this folder yet.</p>'; tally(); return; }

  drawResume();
  items.forEach(function (it) {
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = it.id;
    if (it.verdict) card.dataset.verdict = it.verdict;
    card.dataset.posted = it.posted ? '1' : '0';

    var media = '';
    var paths = it.paths || [];
    if (it.kind === 'video' && paths[0]) {
      var src = it.preview || paths[0];
      var note = '';
      if (it.preview) {
        note = '<p class="flag ok">Light preview. Download gives the full quality original.</p>';
      } else if (/\.mov$/i.test(paths[0])) {
        note = '<p class="flag">Still converting to MP4. Plays on iPhone and Mac until it finishes.</p>';
      }
      media = '<div class="media"><video playsinline preload="metadata" controls src="'
        + esc(publicUrl(src)) + '"></video>' + note + '</div>';
    } else if (paths.length) {
      media = '<div class="media"><div class="strip">'
        + paths.map(function (p) { return '<img loading="lazy" src="' + esc(publicUrl(p)) + '">'; }).join('')
        + '</div><div class="counter"><b>1</b> / ' + paths.length + '</div></div>';
    }

    card.innerHTML = media
      + '<div class="body">'
      + (brand === INBOX && it.tag
          ? '<span class="tag" style="--g1:' + brandColour(it.tag, 0) + ';--g2:'
            + brandColour(it.tag, 1) + '">' + esc(it.tag) + '</span>'
          : '')
      + '<button type="button" class="dayset">' + esc(it.day || 'No day') + '</button>'
      + '<input class="title" value="' + esc(it.title) + '">'
      + '<p class="fmt">' + (it.kind === 'video' ? 'Video' : paths.length + (paths.length === 1 ? ' slide' : ' slides')) + '</p>'
      + '<details class="cap"><summary>Caption</summary>'
      + '<textarea placeholder="Write the caption here">' + esc(it.caption) + '</textarea>'
      + '<button class="ghost copy" type="button">Copy caption</button></details>'
      + '<div class="verdict">'
      + '<button type="button" data-v="approved">Approve</button>'
      + '<button type="button" data-v="changes">Changes</button>'
      + '<button type="button" data-v="rejected">Reject</button></div>'
      + '<textarea class="comment" rows="2" placeholder="Note (optional)">' + esc(it.note) + '</textarea>'
      + '<div class="manage">'
      + (brand === INBOX ? '<button type="button" class="move">Move to\u2026</button>' : '')
      + '<button type="button" class="get">Download</button>'
      + '<button type="button" class="post">'
      + (it.posted ? 'Undo posted' : 'Mark as posted') + '</button>'
      + '<button type="button" class="drop">Delete</button></div>'
      + '</div>';

    var VERB = { approved: 'Approve', changes: 'Changes', rejected: 'Reject' };
    var DONE = { approved: 'Approved', changes: 'Changes asked', rejected: 'Rejected' };

    function paintVerdict() {
      card.querySelectorAll('.verdict button').forEach(function (o) {
        var mine = o.dataset.v === it.verdict;
        o.setAttribute('aria-pressed', String(mine));
        o.textContent = mine ? DONE[o.dataset.v] : VERB[o.dataset.v];
      });
    }

    card.querySelectorAll('.verdict button').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = it.verdict === b.dataset.v ? null : b.dataset.v;
        it.verdict = v;
        if (v) card.dataset.verdict = v; else card.removeAttribute('data-verdict');
        paintVerdict();
        setStamp(card, v, it.id, true);
        patch(it.id, { verdict: v }); tally();
      });
    });
    paintVerdict();
    setStamp(card, it.verdict, it.id, false);

    var dsel = card.querySelector('.dayset');
    dsel.addEventListener('click', function () {
      var opts = [{ label: 'No day', value: '' }].concat(DAYS.map(function (d) {
        return { label: d, value: d };
      }));
      choose('Day to post', opts, it.day || '').then(function (v) {
        if (v === null) return;
        it.day = v || null;
        patch(it.id, { day: it.day });
        items.sort(byDay); drawItems();
      });
    });

    var t = card.querySelector('.title');
    t.addEventListener('change', function () {
      it.title = t.value.trim(); patch(it.id, { title: it.title });
    });
    var capBox = card.querySelector('.cap textarea');
    capBox.addEventListener('change', function () {
      it.caption = capBox.value; patch(it.id, { caption: it.caption }); toast('Caption saved');
    });
    card.querySelector('.cap .copy').addEventListener('click', function () {
      copy(capBox.value, 'Caption copied');
    });
    var note = card.querySelector('.comment');
    note.addEventListener('change', function () {
      it.note = note.value.trim(); patch(it.id, { note: it.note });
    });
    card.querySelector('.get').addEventListener('click', function () {
      if (!paths.length) { toast('Nothing to download'); return; }
      var base = safeName(it.title);
      if (paths.length === 1) {
        pull(paths[0], base + extOf(paths[0]));
        toast('Downloading');
        return;
      }
      /* browsers block a burst of downloads, so they go one at a time */
      toast('Downloading ' + paths.length + ' slides');
      paths.forEach(function (p, i) {
        setTimeout(function () {
          pull(p, base + ' ' + (i + 1) + extOf(p));
        }, i * 900);
      });
    });

    var mv = card.querySelector('.move');
    if (mv) mv.addEventListener('click', function () { moveItem(it); });

    var post = card.querySelector('.post');
    post.addEventListener('click', function () {
      it.posted = !it.posted;
      patch(it.id, { posted: it.posted });
      function apply() {
        card.dataset.posted = it.posted ? '1' : '0';
        post.textContent = it.posted ? 'Undo posted' : 'Mark as posted';
        tally();
      }
      if (it.posted && document.body.classList.contains('hideposted') && !REDUCE) {
        /* it is about to disappear from view, so let it leave instead of vanishing */
        card.classList.add('gone');
        setTimeout(function () { card.classList.remove('gone'); apply(); }, 260);
      } else {
        morph(card, apply);
      }
    });
    card.querySelector('.drop').addEventListener('click', function () {
      confirmBox('Delete this item?', it.title || '', 'Delete').then(function (yes) {
        if (!yes) return;
      busy(true);
      var dead = paths.slice();
      if (it.preview) dead.push(it.preview);
      var step = dead.length ? db.storage.from(BUCKET).remove(dead) : Promise.resolve({});
      step.then(function () { return db.from('items').delete().eq('id', it.id); })
        .then(function () {
          busy(false); toast('Deleted');
          if (REDUCE) { loadItems(); return; }
          card.classList.add('gone');
          setTimeout(loadItems, 260);
        })
        .catch(function (e) { busy(false); toast(String(e.message || e)); });
      });
    });

    var strip = card.querySelector('.strip');
    if (strip) {
      var out = card.querySelector('.counter b');
      strip.addEventListener('scroll', function () {
        out.textContent = Math.min(
          Math.round(strip.scrollLeft / strip.clientWidth) + 1, paths.length);
      }, { passive: true });
    }

    g.appendChild(card);
  });
  tally();
}

/* filing something from the inbox into a brand's week */
function moveItem(it) {
  var first = it.tag
    ? Promise.resolve(it.tag)
    : choose('Which brand?', BRANDS.map(function (b) {
        return { label: b.name, value: b.name }; }), null);
  first.then(function (target) {
    if (!target) return;
    return pickFolder(it, target);
  }).catch(function (e) { toast(String(e.message || e)); });
}

function pickFolder(it, target) {
  return db.from('folders').select('*').eq('brand', target)
    .order('created_at', { ascending: false }).then(function (r) {
      var list = (r.data || []).map(function (f) {
        return { label: f.name, value: f.id }; });
      list.push({ label: '+ New folder', value: '__new__' });
      list.push({ label: 'Different brand\u2026', value: '__brand__' });
      return choose('Which folder in ' + target + '?', list, null).then(function (pick) {
        if (!pick) return;
        if (pick === '__brand__') {
          return choose('Which brand?', BRANDS.map(function (b) {
            return { label: b.name, value: b.name }; }), target).then(function (other) {
            if (other) return pickFolder(it, other);
          });
        }
        if (pick !== '__new__') return finishMove(it, pick, target);
        return ask('New folder in ' + target, 'Name it for the week', 'Week 1', 'Create')
          .then(function (name) {
            if (!name) return;
            return db.from('folders').insert({ brand: target, name: name }).select().single()
              .then(function (ins) {
                if (ins.error) throw ins.error;
                return finishMove(it, ins.data.id, target);
              });
          });
      });
    });
}

function finishMove(it, fid, target) {
  var opts = [{ label: 'No day', value: '' }].concat(DAYS.map(function (d) {
    return { label: d, value: d }; }));
  return choose('Day to post', opts, it.day || '').then(function (day) {
    busy(true);
    return db.from('items').update({ folder_id: fid, day: day || null, tag: target })
      .eq('id', it.id)
      .then(function (r) {
        busy(false);
        if (r.error) { toast(r.error.message); return; }
        loadItems();
        toast('Moved to ' + target);
      });
  });
}

/* ---------- tally and copy ---------- */
function tally() {
  var live = items;
  var done = 0, ok = 0, posted = 0;
  live.forEach(function (it) {
    if (it.verdict) { done++; if (it.verdict === 'approved') ok++; }
    if (it.posted) posted++;
  });
  el('prog').style.width = (live.length ? done / live.length * 100 : 0) + '%';
  el('tally').textContent = live.length
    ? done + ' of ' + live.length + ' decided \u00b7 ' + ok + ' approved \u00b7 ' + posted + ' posted'
    : 'Nothing to review';
}

function copy(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast(msg); },
      function () { fallback(text, msg); });
  } else fallback(text, msg);
}
function fallback(text, msg) {
  var a = document.createElement('textarea');
  a.value = text; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select(); a.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); toast(msg); } catch (e) { toast('Copy failed'); }
  document.body.removeChild(a);
}

el('copy').addEventListener('click', function () {
  var folder = folders.filter(function (f) { return f.id === folderId; })[0];
  var lines = [brand + (folder ? ' \u2014 ' + folder.name : ''), ''];
  items.forEach(function (it) {
    var v = it.posted ? 'POSTED' : (it.verdict ? it.verdict.toUpperCase() : 'NOT DECIDED');
    lines.push('\u2022 ' + (it.day ? it.day + ': ' : '') + (it.title || 'Untitled')
      + ' \u2014 ' + v + (it.note ? ' (' + it.note + ')' : ''));
  });
  copy(lines.join('\n'), 'Decisions copied');
});

el('hidePosted').addEventListener('change', function (e) {
  document.body.classList.toggle('hideposted', e.target.checked);
});

/* ---------- boot ---------- */
try {
  var savedBrand = localStorage.getItem('ab:brand');
  if (savedBrand && (savedBrand === INBOX || BRANDS.some(function (b) { return b.name === savedBrand; }))) brand = savedBrand;
  if (localStorage.getItem('ab:ok')) unlock();
} catch (e) {}
</script></body></html>
