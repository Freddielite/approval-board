<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231A1716%27/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchicon" href="">
<meta name="theme-color" content="#0D0B0A">
<style>
:root{color-scheme:dark;--bg:#0D0B0A;--panel:#1C1816;--panel2:#25201D;--line:rgba(255,255,255,.12);
 --ink:#F3EEE9;--mut:#A39B94;--paper:#F2EBE1;--pink:#1A1412;--pmut:#6B6058;
 --ok:#35D683;--warn:#F2A81E;--no:#FF5A4F;--okInk:#128C4E;--warnInk:#D98A00;--noInk:#C8231B;
 --spring:cubic-bezier(.2,1.15,.3,1);--out:cubic-bezier(.2,.8,.2,1);--drift:cubic-bezier(.3,0,.2,1);
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);min-height:100vh;
 font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 140px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s var(--out),background-color .25s,border-color .25s,color .25s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.disp{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.01em}

/* backdrop: one deep gradient per tab, crossfaded */
.bgl{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;will-change:opacity;transform:translateZ(0);
 transition:opacity .6s var(--drift)}
.bgl.on{opacity:1}
.bgl[data-b="New"]{background:radial-gradient(120% 70% at 85% 0%,#3B2A86 0%,rgba(59,42,134,0) 60%),linear-gradient(180deg,#2A1E63 0%,#17112F 42%,#0C0917 100%)}
.bgl[data-b="Pot of Food"]{background:radial-gradient(120% 70% at 85% 0%,#7A1512 0%,rgba(122,21,18,0) 60%),linear-gradient(180deg,#5A0F0D 0%,#2A0907 42%,#130605 100%)}
.bgl[data-b="Dexter Cyber Lab"]{background:radial-gradient(120% 70% at 85% 0%,#123E8C 0%,rgba(18,62,140,0) 60%),linear-gradient(180deg,#0D2E6B 0%,#081733 42%,#050A17 100%)}
.bgl[data-b="Open Delta"]{background:radial-gradient(120% 70% at 85% 0%,#0D5A35 0%,rgba(13,90,53,0) 60%),linear-gradient(180deg,#0A4A2B 0%,#052414 42%,#030F08 100%)}
.app{position:relative;z-index:1}

/* top strip with folder tabs */
.strip{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px;padding:14px 24px 0}
.brandmark{display:flex;align-items:center;gap:10px;padding-bottom:12px;font-size:15px;font-weight:600}
.mark{position:relative;display:inline-flex}
.mark em{position:absolute;top:-4px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--no);
 border:2px solid var(--bg);display:none}
.mark.waiting em{display:block;animation:pop .4s var(--spring)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end}
.tabs button{display:flex;align-items:center;gap:9px;height:48px;padding:0 18px;border:none;border-radius:16px 16px 0 0;
 background:rgba(255,255,255,.07);color:#D8D0C9;font-size:15px;font-weight:600;white-space:nowrap;
 transition:background-color .6s var(--drift),color .6s var(--drift),transform .12s var(--out)}
.tabs button[aria-pressed=true]{font-weight:700}
.tabs .tdot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tabs .badge{min-width:22px;height:22px;border-radius:11px;background:var(--no);color:#2A0503;font-size:12px;font-weight:700;
 display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.lock{margin:0 0 8px auto;height:38px;padding:0 14px;border-radius:11px;border:1.5px solid var(--line);
 background:transparent;color:#CFC7C0;font-size:13px;font-weight:600}

/* the coloured band */
.band{transition:background-color .6s var(--drift),color .6s var(--drift)}
.bandin{max-width:1360px;margin:0 auto;padding:34px 32px 36px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px 48px}
.bandname{flex:1 1 420px;min-width:0}
.kick{font-size:15px;font-weight:600;opacity:.85;margin-bottom:10px}
.bandname h1{font-size:clamp(54px,9vw,128px);line-height:.88;overflow-wrap:anywhere}
.stats{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:56px;line-height:.9;color:var(--acc)}
.stat span{font-size:14px;font-weight:600;opacity:.85}
.addbtn{height:52px;padding:0 22px;border-radius:14px;border:none;background:var(--bg);color:var(--ink);
 font-size:15px;font-weight:700;align-self:center}

/* toolbar */
.wrap{max-width:1360px;margin:0 auto;padding:26px 32px 0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:30px}
.hint{flex:1 1 260px;font-size:15px;color:var(--mut)}
.folders{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 280px}
.folders:empty{display:none}
.folders button{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.14);
 background:transparent;color:#CFC7C0;font-size:14px;font-weight:700;white-space:nowrap}
.folders button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.folders button.add{border-style:dashed;font-weight:600}
.switch{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;
 border:1.5px solid var(--line);background:transparent;color:#CFC7C0;font-size:14px;font-weight:600}
.switch .track{position:relative;width:36px;height:22px;border-radius:11px;background:rgba(255,255,255,.2);transition:background-color .2s}
.switch .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);
 transition:transform .25s var(--spring)}
.switch[aria-checked=true] .track{background:var(--ok)}
.switch[aria-checked=true] .knob{transform:translateX(14px)}

/* groups and cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:22px;align-items:start}
.ghead{grid-column:1/-1;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;margin:18px 0 -4px}
.grid>.ghead:first-child{margin-top:0}
.ghead h2{font-size:40px;line-height:1;color:var(--c,var(--ink))}
.ghead span{font-size:15px;font-weight:600;color:var(--mut)}
.card{position:relative;border-radius:20px;overflow:hidden;background:var(--paper);color:var(--pink);
 transition:background-color .35s,opacity .35s}
.media{background:#000;position:relative}
.media video{width:100%;display:block;max-height:74vh;object-fit:contain;background:#000}
.strip2{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip2::-webkit-scrollbar{display:none}
.strip2 img{width:100%;flex:0 0 100%;scroll-snap-align:center;display:block}
.counter{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;
 padding:5px 10px;font-size:12px;font-weight:700}
.flag{font-size:12px;font-weight:600;padding:8px 14px;background:rgba(242,168,30,.16);color:#FFD27A}
.flag.ok{background:rgba(53,214,131,.16);color:#8FF0BD}
.slip{position:relative;border-top:2px dashed rgba(26,20,18,.22);padding:18px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--pmut)}
.bdot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.title{width:100%;background:transparent;border:none;border-radius:6px;font-size:21px;font-weight:700;
 letter-spacing:-.015em;line-height:1.15;padding:0 130px 0 0;color:var(--pink)}
.title:focus{outline:2px solid rgba(26,20,18,.3);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:36px;padding:0 13px;border-radius:10px;font-size:13px;font-weight:600;
 border:1.5px dashed rgba(26,20,18,.3);background:transparent;color:var(--pink)}
.chips button.set{border:none;background:var(--pink);color:var(--paper)}
.chips button.has{border-style:solid;border-color:rgba(26,20,18,.18)}
.verdict{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:rgba(26,20,18,.07)}
.verdict button{height:46px;border-radius:11px;border:none;background:transparent;color:var(--pink);font-size:14px;font-weight:600}
.verdict button[aria-pressed=true]{font-weight:700}
.verdict button[aria-pressed=true][data-v=approved]{background:var(--okInk);color:#fff}
.verdict button[aria-pressed=true][data-v=changes]{background:#F0A419;color:#2B1A00}
.verdict button[aria-pressed=true][data-v=rejected]{background:var(--noInk);color:#fff}
.notebox{display:none;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#9A5F00}
.card[data-verdict=changes] .notebox,.card[data-verdict=rejected] .notebox,.card.has-note .notebox{display:flex;animation:up .35s var(--spring) both}
.card[data-verdict=rejected] .notebox{color:#A61C15}
.comment{resize:vertical;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(26,20,18,.2);background:#fff;
 color:var(--pink);font-size:14px;line-height:1.45;min-height:64px}
.actions{display:flex;gap:6px}
.actions button{height:46px;border-radius:12px;border:1.5px solid rgba(26,20,18,.18);background:transparent;
 color:var(--pink);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.actions .grow{flex:1;min-width:0;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions .icon{width:46px;flex:0 0 46px}
.card[data-verdict=approved] .filebtn{border:none;background:var(--pink);color:var(--paper);font-weight:700}
.postedrow{display:none;align-items:center;gap:14px}
.postedtag{font:400 20px/1 Anton,Impact,sans-serif;color:var(--ok);padding:5px 10px;border:2px solid var(--ok);
 border-radius:7px;transform:rotate(-4deg)}
.postedrow .unpost{margin-left:auto;height:40px;padding:0 14px;border-radius:11px;border:1.5px solid rgba(255,255,255,.15);
 background:transparent;color:#CFC7C0;font-size:13px;font-weight:600}
.card[data-posted="1"]{background:#1A1716;color:var(--ink);border:1.5px solid rgba(53,214,131,.4)}
.card[data-posted="1"] .media,.card[data-posted="1"] .chips,.card[data-posted="1"] .verdict,
.card[data-posted="1"] .notebox,.card[data-posted="1"] .actions,.card[data-posted="1"] .stamp{display:none}
.card[data-posted="1"] .slip{border-top:none;gap:8px}
.card[data-posted="1"] .title{color:var(--ink);padding-right:0;font-size:17px}
.card[data-posted="1"] .meta{color:var(--mut)}
.card[data-posted="1"] .postedrow{display:flex}
body.hideposted .card[data-posted="1"]{display:none}

/* the rubber stamp, now inked on paper */
.stamp{position:absolute;top:14px;right:16px;z-index:4;pointer-events:none;transform:rotate(var(--r,-8deg));opacity:.86}
.stamp b{display:block;padding:3px;border:2.5px solid currentColor;border-radius:9px;
 -webkit-mask-image:var(--inkmask);mask-image:var(--inkmask);-webkit-mask-size:280% 280%;mask-size:280% 280%;
 -webkit-mask-position:var(--mx,30%) var(--my,60%);mask-position:var(--mx,30%) var(--my,60%)}
.stamp i{display:block;font:400 29px/1 Anton,Impact,"Arial Black",sans-serif;font-style:normal;letter-spacing:.07em;
 text-transform:uppercase;padding:7px 13px 6px;border:4px solid currentColor;border-radius:6px}
.stamp[data-v=approved]{color:var(--okInk)}
.stamp[data-v=changes]{color:var(--warnInk)}
.stamp[data-v=rejected]{color:var(--noInk)}
.stamp.slam{animation:slam .42s cubic-bezier(.3,.9,.35,1.1) both}
@keyframes slam{0%{transform:translateY(-22px) rotate(calc(var(--r,-8deg) - 10deg)) scale(2.6);opacity:0}
 60%{transform:rotate(calc(var(--r,-8deg) + 1.5deg)) scale(.9);opacity:.95}100%{transform:rotate(var(--r,-8deg)) scale(1);opacity:.86}}
.stamp.lift{animation:lift .26s ease-in both}
@keyframes lift{to{transform:translateY(-26px) rotate(calc(var(--r,-8deg) - 5deg)) scale(1.18);opacity:0}}
.splat{position:absolute;z-index:3;pointer-events:none;width:130px;height:130px;margin:-65px 0 0 -65px;
 border-radius:50%;border:3px solid currentColor;animation:splat .5s ease-out both}
@keyframes splat{0%{transform:scale(.3);opacity:.6}100%{transform:scale(1.9);opacity:0}}

/* placeholders while loading */
.skel{border-radius:20px;overflow:hidden;background:var(--paper)}
.skel i{display:block;background:linear-gradient(90deg,rgba(26,20,18,.06) 30%,rgba(26,20,18,.13) 50%,rgba(26,20,18,.06) 70%);
 background-size:250% 100%;animation:shimmer 1.3s linear infinite}
.skel .m{aspect-ratio:4/5;max-height:44vh;background-color:#1A1716;
 background-image:linear-gradient(90deg,rgba(255,255,255,.03) 30%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.03) 70%)}
.skel .l{height:18px;margin:20px 18px 10px;border-radius:6px;width:58%}
.skel .s{height:12px;margin:0 18px;border-radius:6px;width:30%}
.skel .v{height:46px;margin:18px;border-radius:12px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}

/* arrivals after a tab or week change */
.grid.enter>*{animation:rise .45s var(--out) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card.thud{animation:thud .36s ease-out}
@keyframes thud{0%{transform:none}22%{transform:scale(.982) translate(-2px,2px)}48%{transform:scale(.992) translate(2px,-1px)}74%{transform:translate(-1px,1px)}100%{transform:none}}
.card.gone{animation:gone .26s ease-in both}
@keyframes gone{to{opacity:0;transform:scale(.95)}}

/* empty states */
.emptyst{grid-column:1/-1;padding:40px 0 30px;max-width:560px}
.emptyst h2{font-size:64px;line-height:.95}
.emptyst p{margin:14px 0 24px;font-size:16px;line-height:1.55;color:var(--mut)}

/* buttons used across sheets */
.ghost{height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);
 color:var(--ink);font-size:15px;font-weight:600}
.solid{height:48px;padding:0 20px;border-radius:14px;border:none;background:var(--ink);color:var(--bg);font-size:15px;font-weight:700}
.danger{height:48px;padding:0 20px;border-radius:14px;border:none;background:#E0453C;color:#fff;font-size:15px;font-weight:700}

/* footer dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;
 display:flex;align-items:center;gap:16px;padding:8px 8px 8px 20px;border-radius:18px;background:var(--panel);
 border:1.5px solid var(--line);max-width:calc(100vw - 24px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dockcounts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-weight:600}
.dockcounts span{display:flex;align-items:center;gap:7px;white-space:nowrap}
.dockcounts i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.dockcounts i.hollow{background:transparent;border:1.5px solid var(--mut)}
.dock .solid{white-space:nowrap;height:46px}

/* floating bars */
.resume{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
 border:1.5px solid rgba(242,168,30,.45);background:rgba(242,168,30,.12)}
.resume span{flex:1;font-size:14px;font-weight:600;color:#FFD27A}
.work{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:28;
 width:min(92vw,440px);background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:none}
.work.on{display:block;animation:up .4s var(--spring) both}
.work b{display:block;font-size:14px;font-weight:600}
.work i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}
.work i u{display:block;height:100%;width:0;background:var(--warn);transition:width .45s var(--out)}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:29;
 width:min(92vw,520px);display:none;align-items:center;gap:12px;padding:10px 10px 10px 16px;background:var(--panel);
 border:1.5px solid rgba(255,255,255,.2);border-radius:16px}
.update.on{display:flex;animation:up .42s var(--spring) both}
.update span{flex:1;font-size:14px}
.update .solid{height:40px;padding:0 14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:60;
 background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:13px 20px;border-radius:999px;opacity:0;
 transition:opacity .2s,transform .38s var(--spring);pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;z-index:45;background:rgba(8,6,5,.7);display:none;align-items:center;justify-content:center;
 font-size:15px;font-weight:600}
.busy.on{display:flex}

/* passcode */
.gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;
 padding:32px 20px;transition:opacity .28s}
.gate.out{opacity:0;pointer-events:none}
.gatebox{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.gatebox h2{font-size:56px;line-height:.95}
.gatebox p{margin-top:10px;font-size:15px;color:var(--mut)}
.pins{display:flex;gap:16px}
.pins i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);transition:background-color .15s,transform .15s}
.pins i.on{background:var(--ink);transform:scale(1.1)}
.pins.bad i{border-color:var(--no)}
.pins.bad i.on{background:var(--no)}
.pins.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.keys button{height:68px;border-radius:18px;border:none;background:var(--panel);color:var(--ink);font:400 30px Anton,Impact,sans-serif}
.keys button.del{font:600 16px "Bricolage Grotesque",sans-serif;background:transparent}
.keys .blank{visibility:hidden}

/* upload sheet */
.sheet{position:fixed;inset:0;z-index:48;background:rgba(8,6,5,.62);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex;animation:fade .2s both}
.panel{width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);
 border-radius:26px 26px 0 0;padding:26px 22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.on .panel{animation:up .42s var(--spring) both}
.panel h3{font-size:40px;line-height:1}
.panel .sub{font-size:14px;font-weight:600;color:var(--mut);margin-bottom:4px;order:-1}
.rows{overflow-y:auto;margin:20px 0 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.rw{border-radius:16px;background:var(--panel2);padding:14px}
.rw b{display:block;font-size:16px;font-weight:700;word-break:break-word}
.rw small{display:block;color:var(--mut);font-size:13px;margin:2px 0 12px}
.rw .chiprow{display:flex;flex-wrap:wrap;gap:6px}
.rw .chiprow button{display:flex;align-items:center;gap:8px;height:42px;padding:0 13px;border-radius:11px;
 border:1.5px solid rgba(255,255,255,.14);background:transparent;color:var(--ink);font-size:13px;font-weight:700}
.rw .chiprow button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.rw .chiprow button[aria-pressed=true]{border-color:transparent;background:var(--c);color:var(--fg)}
.rw .chiprow button[aria-pressed=true] i{background:var(--fg)}
.sheetfoot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* choice sheets */
.pop{position:fixed;inset:0;z-index:60;background:rgba(8,6,5,.62);display:none;align-items:flex-end;justify-content:center;
 opacity:0;transition:opacity .16s}
.pop.on{display:flex}
.pop.show{opacity:1}
.popcard{width:100%;max-width:520px;background:var(--panel);border-radius:26px 26px 0 0;padding:26px 22px;
 padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow-y:auto;

  var ch;

    ch = db.channel('board-' + Date.now());
    live.ch = ch;
    ch.on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, function (p) {
        if (busyNow()) { live.missed = true; return; }
        if (!isEcho(p)) loadItems();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'folders' }, function () {
        if (busyNow()) { live.missed = true; return; }
        loadFolders(true);
      })
      .subscribe(function (status) {
        if (ch !== live.ch) return;
        if (status === 'SUBSCRIBED') {
          var back = live.up && live.status !== 'SUBSCRIBED';
          live.status = status; live.up = true; live.retry = 0;
          if (back) refresh();   /* fetch whatever happened while the line was down */
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          live.status = status;
          clearTimeout(live.t);
          var wait = Math.min(30000, 2000 * Math.pow(2, live.retry++));
          live.t = setTimeout(function () { if (ch === live.ch) listen(); }, wait);
        }
      });
  } catch (e) { console.warn('live updates unavailable', e); }
}

/* quiet re-fetch; redraws only if something actually changed */
function refresh() {
  if (!db) return;
  if (busyNow() || popBusy) { live.missed = true; return; }
  live.missed = false;
  loadFolders(true);
}

/* a new version of the board is live: reload when nothing would be lost */
var bootSig = null, updateWaiting = false, lastInput = Date.now();
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
  window.addEventListener(ev, function () { lastInput = Date.now(); }, { passive: true, capture: true });
});
function safeToReload() {
  if (busyNow() || popBusy || el('sheet').classList.contains('on')) return false;
  var a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox'))) return false;
  return !Array.prototype.some.call(document.querySelectorAll('video'), function (v) {
    return !v.paused && !v.ended;
  });
}
function checkVersion() {
  if (!window.fetch) return;
  fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      if (!t) return;
      var sig = hashOf(t);
      if (bootSig === null) { bootSig = sig; return; }
      if (sig !== bootSig) { updateWaiting = true; maybeReload(); }
    }).catch(function () {});
}
function maybeReload() {
  if (!updateWaiting) return;
  if (safeToReload() && (document.hidden || Date.now() - lastInput > 60000)) { location.reload(); return; }
  el('update').classList.add('on');
}
el('updateGo').addEventListener('click', function () {
  if (busyNow()) { toast('Wait for the upload to finish first'); return; }
  location.reload();
});

function wake() {
  if (!db || document.hidden) return;
  refresh();
  if (live.status !== 'SUBSCRIBED') { live.retry = 0; listen(); }
  checkVersion();
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) maybeReload(); else wake();
});
window.addEventListener('online', wake);
window.addEventListener('pageshow', function (e) { if (e.persisted) wake(); });

/* a redraw skipped while someone was typing happens once they leave the box */
document.addEventListener('focusout', function (e) {
  if (!live.drawPending || !el('grid').contains(e.target)) return;
  setTimeout(function () {
    var a = document.activeElement;
    if (a && el('grid').contains(a) && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return;
    live.drawPending = false;
    loadItems(true);
  }, 400);
});

function start() {
  if (!window.supabase) { el('sub').textContent = 'Could not load. Check connection.'; return; }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  drawTabs();
  navAnim = 'up'; skeleton();
  syncSchema().then(function () {
    loadFolders();
    listen();
    checkVersion();
    setInterval(function () { if (!document.hidden) refresh(); maybeReload(); }, POLL_MS);
    setInterval(function () { if (!document.hidden) checkVersion(); }, VERSION_MS);
  });
}

function drawTabs() {
  var t = el('tabs');
  t.innerHTML = '';
  [{ name: INBOX }].concat(BRANDS).forEach(function (b) {
    var th = THEME[b.name], on = b.name === brand;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = '<span class="tdot"></span>' + esc(b.name)
      + (b.name === INBOX && waitingCount > 0 ? '<span class="badge">' + waitingCount + '</span>' : '');
    btn.style.setProperty('--c', on ? th.fg : th.dot);
    if (on) { btn.style.background = th.bg; btn.style.color = th.fg; }
    btn.setAttribute('aria-pressed', String(on));
    btn.addEventListener('click', function () {
      if (b.name === brand) return;
      var names = [INBOX].concat(BRANDS.map(function (x) { return x.name; }));
      navAnim = 'up';
      skeleton();
      brand = b.name; folderId = null;
      try { localStorage.setItem('ab:brand', brand); } catch (e) {}
      drawTabs(); loadFolders();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    t.appendChild(btn);
  });
  paintTheme();
}

/* band colour, backdrop and big name follow the open tab */
function paintTheme() {
  var th = THEME[brand] || THEME[INBOX];
  var band = el('band');
  band.style.background = th.bg; band.style.color = th.fg;
  band.style.setProperty('--acc', th.acc);
  el('bname').textContent = brand;
  document.querySelectorAll('.bgl').forEach(function (l) { l.classList.toggle('on', l.dataset.b === brand); });
}

function kicker() {
  if (brand === INBOX) return 'Inbox';
  var f = folders.filter(function (x) { return x.id === folderId; })[0];
  return f ? f.name : 'Brand';
}

function loadFolders(quiet) {
  if (!quiet) el('sub').textContent = 'Loading…';
  var asked = brand;
  db.from('folders').select('*').eq('brand', asked).order('created_at', { ascending: false })
    .then(function (r) {
      if (asked !== brand) return;   /* tab changed while this was loading */
      if (r.error) { if (!quiet) el('sub').textContent = r.error.message; return; }
      var same = JSON.stringify(folders) === JSON.stringify(r.data || []);
      folders = r.data || [];
      if (asked === INBOX) {
        /* New is one folder. If it is missing, make it; if two exist, use the oldest
           so every open board lands on the same one. */
        if (!folders.length) { makeInbox().catch(function () {}); return; }
        folderId = folders[folders.length - 1].id;
      } else if (!folderId || !folders.some(function (f) { return f.id === folderId; })) {
        folderId = folders.length ? folders[0].id : null;
      }
      if (!quiet || !same) drawFolders();
      loadItems();
    });
}

/* find New, or create it if it really is missing */
function ensureInbox() {
  return db.from('folders').select('id').eq('brand', INBOX)
    .order('created_at', { ascending: true }).limit(1)
    .then(function (r) {
      if (r.error) throw r.error;
      if (r.data && r.data.length) { folderId = r.data[0].id; return folderId; }
      return makeInbox();
    });
}

/* the New folder is created here, once, whenever it is found missing */
var inboxMaking = null;
function makeInbox() {
  if (!inboxMaking) {
    inboxMaking = db.from('folders').insert({ brand: INBOX, name: INBOX }).select().single()
      .then(function (r) {
        inboxMaking = null;
        if (r.error) throw r.error;
        if (brand === INBOX) folderId = r.data.id;
        return r.data.id;
      }, function (e) { inboxMaking = null; throw e; });
  }
  return inboxMaking.then(function (id) {
    if (brand === INBOX) loadFolders();
    return id;
  }).catch(function (e) {
    el('sub').textContent = 'Could not set up New: ' + (e.message || e);
    throw e;
  });
}

function drawFolders() {
  var f = el('folders');
  f.innerHTML = '';
  el('hint').style.display = '';
  el('add').textContent = brand === INBOX ? 'Add content' : 'Add in New';
  el('sub').textContent = kicker();
  if (brand === INBOX) {
    el('hint').textContent = 'Everything lands here first. Decide, then file it to its brand.';
    return;
  }
  folders.forEach(function (fo) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = fo.name;
    b.setAttribute('aria-pressed', String(fo.id === folderId));
    b.addEventListener('click', function () {
      if (fo.id === folderId) return;
      folderId = fo.id; navAnim = 'up'; skeleton(); drawFolders(); loadItems();
    });
    b.title = 'Double tap to delete this week';
    b.addEventListener('dblclick', function () { removeFolder(fo); });
    f.appendChild(b);
  });
  var add = document.createElement('button');
  add.type = 'button'; add.className = 'add'; add.textContent = 'New week';
  add.addEventListener('click', newFolder);
  f.appendChild(add);
  el('hint').style.display = 'none';
}

function newFolder() {
  ask('New week', 'Name it for the week or the campaign',
      'Week ' + (folders.length + 1), 'Create').then(function (name) {
    if (!name) return;
    makeFolder(name);
  });
}

function makeFolder(name) {
  busy(true);
  db.from('folders').insert({ brand: brand, name: name.trim() }).select().single()
    .then(function (r) {
      busy(false);
      if (r.error) { toast(r.error.message); return; }
      folderId = r.data.id; loadFolders(); toast('Folder created');
    });
}

function removeFolder(fo) {
  confirmBox('Delete ' + fo.name + '?',
    'This removes the folder and every item inside it.', 'Delete folder')
    .then(function (yes) { if (yes) doRemoveFolder(fo); });
}

function doRemoveFolder(fo) {
  busy(true);
  db.from('items').select('paths,preview').eq('folder_id', fo.id).then(function (r) {
    var paths = [];
    (r.data || []).forEach(function (it) {
      paths = paths.concat(it.paths || []);
      if (it.preview) paths.push(it.preview);
    });
    var step = paths.length ? db.storage.from(BUCKET).remove(paths) : Promise.resolve({});
    return step.then(function () { return db.from('folders').delete().eq('id', fo.id); });
  }).then(function () {
    busy(false); folderId = null; loadFolders(); toast('Folder deleted');
  }).catch(function (e) { busy(false); toast(String(e.message || e)); });
}

function loadItems(force) {
  if (!folderId) { items = []; drawItems(); el('sub').textContent = kicker(); return; }
  var asked = folderId;
  db.from('items').select('*').eq('folder_id', asked)
    .order('created_at', { ascending: true })
    .then(function (r) {
      if (asked !== folderId) return;
      if (r.error) { toast(r.error.message); return; }
      var fresh = (r.data || []).sort(byDay);
      var same = JSON.stringify(fresh) === JSON.stringify(items);
      items = fresh;
      el('sub').textContent = kicker();
      countWaiting();
      if (same && !force && !navAnim && !live.drawPending && !el('grid').querySelector('.skel')
          && drawnFor === brand + '|' + folderId) return;
      drawItems();
    });
}

/* ---------- uploads ---------- */
el('add').addEventListener('click', function () {
  if (brand === INBOX) {
    if (!folderId) {
      /* still loading or missing: make sure it exists, then open the picker */
      ensureInbox().then(function () { el('picker').click(); }, function () {});
      return;
    }
    el('picker').click();
    return;
  }
  /* new content always lands in New, then gets filed from there */
  brand = INBOX;
  try { localStorage.setItem('ab:brand', brand); } catch (e) {}
  drawTabs();
  loadFolders();
  toast('New content goes here first');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(function () { el('picker').click(); }, 450);
});

var VID = /\.(mov|mp4|m4v|webm|avi|mkv|3gp)$/i;
var IMG = /\.(png|jpe?g|webp|gif|heic|heif)$/i;
function isVideo(f) { return f.type.indexOf('video') === 0 || VID.test(f.name); }
function isImage(f) { return f.type.indexOf('image') === 0 || IMG.test(f.name); }

/* slides of one carousel share a name and end in a number: POF-bulk-1, POF-bulk-2 ... */
function stem(name) { return name.replace(/\.[^.]+$/, ''); }
function groupOf(name) {
  var m = stem(name).match(/^(.*?)[ _.\-]*(\d+)$/);
  return m && m[1] ? { key: m[1], n: parseInt(m[2], 10) } : { key: stem(name), n: 0 };
}

el('picker').addEventListener('change', function (e) {
  var files = [].slice.call(e.target.files);
  e.target.value = '';
  if (!files.length) return;

  pending = [];
  files.filter(isVideo).forEach(function (v) {
    pending.push({ kind: 'video', title: stem(v.name), files: [v] });
  });

  var buckets = {}, order = [];
  files.filter(isImage).forEach(function (img) {
    var g = groupOf(img.name);
    if (!buckets[g.key]) { buckets[g.key] = []; order.push(g.key); }
    buckets[g.key].push({ f: img, n: g.n });
  });
  order.forEach(function (k) {
    pending.push({ kind: 'carousel', title: k,
      files: buckets[k].sort(function (a, b) { return a.n - b.n; })
        .map(function (x) { return x.f; }) });
  });

  openSheet();
});

var pending = [];

function openSheet() {
  var rows = el('rows');
  rows.innerHTML = '';
  var inbox = brand === INBOX;
  el('sheet').querySelector('.sub').textContent = pending.length + (pending.length === 1 ? ' new item' : ' new items');
  pending.forEach(function (job) {
    job.brand = inbox ? guessBrand(job.title) : brand;
    job.day = null;
    var r = document.createElement('div');
    r.className = 'rw';
    r.innerHTML = '<b>' + esc(job.title) + '</b><small>'
      + (job.kind === 'video' ? 'Video' : job.files.length + (job.files.length === 1 ? ' image' : ' images, one carousel'))
      + '</small><div class="chiprow" role="group" aria-label="Brand">'
      + BRANDS.map(function (x) {
          var th = THEME[x.name];
          return '<button type="button" data-b="' + esc(x.name) + '" aria-pressed="' + (job.brand === x.name)
            + '" style="--c:' + th.bg + ';--fg:' + th.fg + '"><i></i>' + esc(x.name) + '</button>';
        }).join('') + '</div>';
    r.querySelectorAll('.chiprow button').forEach(function (b) {
      b.addEventListener('click', function () {
        job.brand = b.dataset.b;
        r.querySelectorAll('.chiprow button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      });
    });
    rows.appendChild(r);
  });
  el('sheet').classList.add('on');
}

el('cancel').addEventListener('click', function () {
  pending = []; el('sheet').classList.remove('on');
});

/* files arrive pre-named, so POF-, DCL- and OD- prefixes pick the brand for you */
function guessBrand(title) {
  var t = String(title || '').toLowerCase();
  if (/^(pof|pot)/.test(t)) return 'Pot of Food';
  if (/^(dcl|dexter)/.test(t)) return 'Dexter Cyber Lab';
  if (/^(od|opendelta|open)/.test(t)) return 'Open Delta';
  return null;
}

el('go').addEventListener('click', function () {
  if (pending.some(function (j) { return !j.brand; })) { toast('Pick a brand for each one'); return; }
  el('sheet').classList.remove('on');
  var jobs = pending.slice();
  pending = [];
  send(jobs);
});

function send(jobs) {
  if (!jobs.length) return;
  var folderName = (folders.filter(function (f) { return f.id === folderId; })[0] || {}).name
    || INBOX;
  var total = jobs.reduce(function (n, j) { return n + j.files.length; }, 0), done = 0;
  busy('Uploading 0 of ' + total + '\u2026');

  var chain = Promise.resolve();
  jobs.forEach(function (job) {
    chain = chain.then(function () {
      var home = (brand === INBOX)
        ? folderFor(INBOX, INBOX)
        : folderFor(job.brand, folderName);
      return home.then(function (fid) {
        return makeItem(job, fid, function () {
          done++; busy('Uploading ' + done + ' of ' + total + '\u2026');
        });
      });
    });
  });

  var movs = jobs.reduce(function (n, j) {
    return n + j.files.filter(function (f) { return /\.mov$/i.test(f.name); }).length; }, 0);
  chain.then(function () {
    busy(false); loadFolders();
    var elsewhere = (brand === INBOX) ? 0
      : jobs.filter(function (j) { return j.brand !== brand; }).length;
    if (movs) toast(movs + ' .MOV uploaded. Preview works on iPhone only.');
    else if (elsewhere) toast(jobs.length + ' uploaded \u00b7 ' + elsewhere + ' sent to other brands');
    else toast(jobs.length === 1 ? 'Uploaded' : jobs.length + ' items uploaded');
  }).catch(function (err) { busy(false); toast(String(err.message || err)); });
}

/* each brand keeps its own copy of a week, made on demand */
function folderFor(targetBrand, name) {
  if (targetBrand === brand && folderId) return Promise.resolve(folderId);
  return db.from('folders').select('*').eq('brand', targetBrand).eq('name', name)
    .order('created_at', { ascending: true })
    .then(function (r) {
      if (r.data && r.data.length) return r.data[0].id;
      return db.from('folders').insert({ brand: targetBrand, name: name }).select().single()
        .then(function (ins) {
          if (ins.error) throw ins.error;
          return ins.data.id;
        });
    });
}

function makeItem(job, fid, tick) {
  var paths = [];
  var chain = Promise.resolve();
  job.files.forEach(function (f) {
    chain = chain.then(function () {
      var path = fid + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)
        + '-' + f.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
      return db.storage.from(BUCKET).upload(path, f, { contentType: f.type })
        .then(function (r) {
          if (r.error) throw r.error;
          paths.push(path); if (tick) tick();
        });
    });
  });
  return chain.then(function () {
    return db.from('items').insert({
      folder_id: fid, kind: job.kind, paths: paths, title: job.title,
      day: job.day || null, tag: job.brand || null
    }).select().single();
  }).then(function (r) {
    if (r.error) throw r.error;
    if (job.kind === 'video' && job.files[0]) {
      return wantsProxy(job.files[0]).then(function (yes) {
        if (yes) queueProxy(r.data.id, fid, job.files[0], paths);
      });
    }
  });
}

/* ---------- light preview, built in the browser ---------- */
window.addEventListener('beforeunload', function (e) {
  if (working || queue.length) { e.preventDefault(); e.returnValue = ''; return ''; }
});

var FF = {
  lib: 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js',
  util: 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.js',
  core: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
  wasm: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'
};
var ff = null, ffLoading = null, queue = [], working = false;

function twice(fn, label, inst, scratch) {
  return fn().catch(function (err) {
    console.warn('retrying ' + label, err);
    work('Retrying ' + label, 0);
    if (inst && scratch) { try { inst.deleteFile(scratch); } catch (e) {} }
    return new Promise(function (r) { setTimeout(r, 1200); }).then(fn);
  });
}

/* a truncated encode is small and useless, so it never reaches storage */
function sane(out, label) {
  if (!out || !out.buffer || out.buffer.byteLength < 20000) {
    throw new Error(label + ' came out empty');
  }
  return out;
}

function script(src) {
  return new Promise(function (res, rej) {
    var t = document.createElement('script');
    t.src = src; t.onload = res; t.onerror = function () { rej(new Error('load failed')); };
    document.head.appendChild(t);
  });
}

function getFF() {
  if (ff) return Promise.resolve(ff);
  if (ffLoading) return ffLoading;
  work('Getting the converter ready', 0);
  ffLoading = script(FF.lib)
    .then(function () { return script(FF.util); })
    .then(function () {
      var inst = new window.FFmpegWASM.FFmpeg();
      inst.on('progress', function (p) {
        if (p && typeof p.progress === 'number') work(null, Math.min(p.progress, 1));
      });
      return window.FFmpegUtil.toBlobURL(FF.core, 'text/javascript').then(function (core) {
        return window.FFmpegUtil.toBlobURL(FF.wasm, 'application/wasm').then(function (wasm) {
          return inst.load({ coreURL: core, wasmURL: wasm }).then(function () {
            ff = inst; return ff;
          });
        });
      });
    });
  return ffLoading;
}

function work(label, frac) {
  var box = el('work');
  if (label === false) { box.classList.remove('on'); return; }
  box.classList.add('on');
  if (label) el('worktitle').textContent = label;
  if (typeof frac === 'number') {
    el('workbar').firstChild.style.width = Math.round(frac * 100) + '%';
  }
}

/* only a file the browser cannot play, or a very big one, is worth converting */
function wantsProxy(file) {
  if (/\.mov$/i.test(file.name)) return Promise.resolve(true);
  if (file.size < 60 * 1024 * 1024) return Promise.resolve(false);
  return playable(file);
}

/* ask the browser directly instead of guessing from the name */
function playable(file) {
  return new Promise(function (res) {
    var v = document.createElement('video');
    var url = URL.createObjectURL(file);
    var settled = false;
    function done(ok) {
      if (settled) return;
      settled = true; URL.revokeObjectURL(url); res(!ok);
    }
    v.preload = 'metadata';
    v.onloadedmetadata = function () { done(true); };
    v.onerror = function () { done(false); };
    setTimeout(function () { done(true); }, 4000);
    v.src = url;
  });
}

function queueProxy(itemId, fid, file, paths) {
  queue.push({ id: itemId, fid: fid, file: file, paths: paths });
  runQueue();
}

function runQueue() {
  if (working || !queue.length) return;
  working = true;
  var job = queue.shift();
  var left = queue.length ? ' (' + (queue.length + 1) + ' left)' : '';
  var isMov = /\.mov$/i.test(job.file.name);
  var inName = 'in' + (isMov ? '.mov' : '.mp4');
  var fields = {}, oldPath = job.paths[0];

  getFF().then(function (inst) {
    return window.FFmpegUtil.fetchFile(job.file).then(function (data) {
      return inst.writeFile(inName, data);
    }).then(function () {
      /* the small copy first, so the board is usable while the big one runs */
      work('Making preview' + left, 0);
      return twice(function () {
      return inst.exec(['-y', '-i', inName, '-vf', 'scale=-2:480', '-c:v', 'libx264',
        '-profile:v', 'baseline', '-level', '3.1', '-preset', 'veryfast', '-crf', '30',
        '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '64k',
        '-movflags', '+faststart', 'out.mp4'])
        .then(function () { return inst.readFile('out.mp4'); })
        .then(function (out) {
          sane(out, 'Preview');
          var blob = new Blob([out.buffer], { type: 'video/mp4' });
          var path = job.fid + '/' + job.id + '-preview.mp4';
          return db.storage.from(BUCKET).upload(path, blob,
            { contentType: 'video/mp4', upsert: true }).then(function (r) {
            if (r.error) throw r.error;
            fields.preview = path;
            inst.deleteFile('out.mp4').catch(function () {});
            return db.from('items').update({ preview: path }).eq('id', job.id)
              .then(function () { loadItems(); });
          });
        }); }, 'preview', inst, 'out.mp4');
    }).then(function () {
      /* then H.264 at full size, which is the format every app accepts */
      if (!isMov) return null;
      work('Converting to MP4' + left, 0);
      return twice(function () {
      return inst.exec(['-y', '-i', inName, '-c:v', 'libx264', '-profile:v', 'high',
        '-level', '4.2', '-preset', 'faster', '-crf', '20', '-pix_fmt', 'yuv420p',
        '-tag:v', 'avc1', '-c:a', 'aac', '-b:a', '160k',
        '-movflags', '+faststart', 'full.mp4'])
        .then(function () { return inst.readFile('full.mp4'); })
        .then(function (out) {
          sane(out, 'MP4');
          if (out.buffer.byteLength > 48 * 1024 * 1024) {
            work('Still a bit large, trimming it down', 0);
            return inst.exec(['-y', '-i', inName, '-c:v', 'libx264', '-profile:v', 'high',
              '-level', '4.2', '-preset', 'faster', '-crf', '23', '-pix_fmt', 'yuv420p',
              '-tag:v', 'avc1', '-c:a', 'aac', '-b:a', '160k',
              '-movflags', '+faststart', 'full.mp4'])
              .then(function () { return inst.readFile('full.mp4'); })
              .then(function (second) { return sane(second, 'MP4'); });
          }
          return out;
        })
        .then(function (out) {
          var blob = new Blob([out.buffer], { type: 'video/mp4' });
          var path = job.fid + '/' + job.id + '-full.mp4';
          work('Saving MP4', 1);
          return db.storage.from(BUCKET).upload(path, blob,
            { contentType: 'video/mp4', upsert: true }).then(function (r) {
            if (r.error) throw r.error;
            fields.paths = [path];
            inst.deleteFile('full.mp4').catch(function () {});
          });
        }); }, 'conversion', inst, 'full.mp4');
    }).then(function () {
      inst.deleteFile(inName).catch(function () {});
      if (!fields.paths) return null;
      return db.from('items').update({ paths: fields.paths }).eq('id', job.id);
    }).then(function () {
      if (fields.paths && oldPath) return db.storage.from(BUCKET).remove([oldPath]);
    }).then(function () { loadItems(); });
  }).catch(function (err) {
    console.error(err);
    var why = (err && (err.message || err.name)) || 'unknown reason';
    if (/load failed|Failed to fetch|NetworkError/i.test(why)) {
      why = 'could not download the converter';
    } else if (/memory|allocat/i.test(why)) {
      why = 'the phone ran out of memory';
    }
    toast('Could not make a preview (' + why + '). The video itself is fine and already saved.');
  }).then(function () {
    working = false;
    if (queue.length) runQueue();
    else { work(false); if (live.missed) refresh(); }
  });
}

/* work left half done is found again on the next visit */
function unfinished() {
  return items.filter(function (it) {
    if (it.kind !== 'video' || !it.paths || !it.paths[0]) return false;
    if (queue.some(function (q) { return q.id === it.id; })) return false;
    return /\.mov$/i.test(it.paths[0]);
  });
}

function drawResume() {
  var old = el('resume');
  if (old) old.remove();
  var left = unfinished();
  if (!left.length || working) return;
  var bar = document.createElement('div');
  bar.id = 'resume';
  bar.className = 'resume';
  bar.innerHTML = '<span>' + left.length +
    (left.length === 1 ? ' video still needs converting' : ' videos still need converting') +
    '</span><button class="ghost" type="button">Finish them</button>';
  bar.querySelector('button').addEventListener('click', function () {
    bar.remove(); resume(left);
  });
  el('grid').before(bar);
}

function resume(list) {
  work('Fetching ' + list.length + ' file' + (list.length > 1 ? 's' : ''), 0);
  var chain = Promise.resolve();
  list.forEach(function (it) {
    chain = chain.then(function () {
      return db.storage.from(BUCKET).download(it.paths[0]).then(function (r) {
        if (r.error || !r.data) throw (r.error || new Error('download failed'));
        var name = /\.mov$/i.test(it.paths[0]) ? 'resume.mov' : 'resume.mp4';
        var f = new File([r.data], name, { type: r.data.type || 'video/mp4' });
        queueProxy(it.id, it.folder_id, f, it.paths);
      });
    });
  });
  chain.catch(function (e) { toast('Could not fetch: ' + (e.message || e)); work(false); });
}

/* ---------- items ---------- */
function patch(id, fields) {
  return db.from('items').update(fields).eq('id', id).then(function (r) {
    if (r.error) toast(r.error.message);
  });
}

function brandColour(name, i) {
  var b = BRANDS.filter(function (x) { return x.name === name; })[0];
  return b ? (i ? b.c2 : b.c1) : '#6E56CF';
}

function byDay(a, b) {
  if (brand === INBOX) {
    var ta = a.tag || 'zz', tb = b.tag || 'zz';
    if (ta !== tb) return ta.localeCompare(tb);
  }
  var ia = a.day ? DAYS.indexOf(a.day) : 99, ib = b.day ? DAYS.indexOf(b.day) : 99;
  if (ia !== ib) return ia - ib;
  return String(a.created_at).localeCompare(String(b.created_at));
}

function emptyState(g) {
  var t, p, label, act;
  if (brand === INBOX) {
    t = 'All clear'; p = 'Nothing is waiting. Add content to start the next round.'; label = 'Add content';
    act = function () { el('add').click(); };
  } else if (!folderId) {
    t = 'No weeks yet'; p = 'Make a folder for this week. Approved content gets filed into it from New.'; label = 'Make Week 1';
    act = function () { makeFolder('Week 1'); };
  } else {
    t = 'Nothing filed yet'; p = 'Approve content in New, then file it here.'; label = 'Go to New';
    act = function () { el('tabs').querySelector('button').click(); };
  }
  var d = document.createElement('div');
  d.className = 'emptyst';
  d.innerHTML = '<h2 class="disp">' + esc(t) + '</h2><p>' + esc(p) + '</p>'
    + '<button type="button" class="solid">' + esc(label) + '</button>';
  d.querySelector('button').addEventListener('click', act);
  g.appendChild(d);
}

/* section headings: by brand in New, by day inside a brand's week */
function groupKey(it) { return brand === INBOX ? (it.tag || '') : (it.day || ''); }
function groupHead(key, list) {
  var h = document.createElement('div');
  h.className = 'ghead';
  var n = list.length, title, colour = '';
  if (brand === INBOX) {
    title = key ? 'For ' + key : 'No brand yet';
    colour = key && THEME[key] ? THEME[key].dot : '#A39B94';
    var w = list.filter(function (x) { return !x.verdict; }).length;
    var sub = n + (n === 1 ? ' item' : ' items') + (w ? ', ' + w + ' waiting' : ', all decided');
  } else {
    title = key || 'No day yet';
    colour = key ? '' : '#A39B94';
    var sub = n + (n === 1 ? ' item' : ' items');
  }
  if (colour) h.style.setProperty('--c', colour);
  h.innerHTML = '<h2 class="disp">' + esc(title) + '</h2><span>' + esc(sub) + '</span>';
  return h;
}

var drawnFor = '';   /* which tab and week the grid currently shows */
function drawItems() {
  var g = el('grid');
  var typing = document.activeElement;
  if (typing && g.contains(typing) &&
      (typing.tagName === 'TEXTAREA' || typing.tagName === 'INPUT')) {
    live.drawPending = true;   /* drawn once they leave the box */
    return;   /* someone is mid sentence, leave the page alone */
  }
  g.innerHTML = '';
  drawnFor = brand + '|' + folderId;
  g.classList.remove('enter', 'fromL', 'fromR');
  var anim = navAnim; navAnim = null;
  if (anim && !REDUCE) {
    requestAnimationFrame(function () {
      Array.prototype.forEach.call(g.children, function (c, i) { c.style.setProperty('--i', Math.min(i, 8)); });
      g.classList.add('enter');
      if (anim !== 'up') g.classList.add(anim);
      clearTimeout(g._enter);
      g._enter = setTimeout(function () { g.classList.remove('enter', 'fromL', 'fromR'); }, 1000);
    });
  }
  if (!folderId || !items.length) { emptyState(g); tally(); return; }

  drawResume();
  var lastKey = null;
  items.forEach(function (it) {
    var key = groupKey(it);
    if (key !== lastKey) {
      lastKey = key;
      g.appendChild(groupHead(key, items.filter(function (x) { return groupKey(x) === key; })));
    }
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = it.id;
    if (it.verdict) card.dataset.verdict = it.verdict;
    card.dataset.posted = it.posted ? '1' : '0';

    var media = '';
    var paths = it.paths || [];
    if (it.kind === 'video' && paths[0]) {
      var src = it.preview || paths[0];
      var note = '';
      if (it.preview) {
        note = '<p class="flag ok">Light preview. Download gives the full quality original.</p>';
      } else if (/\.mov$/i.test(paths[0])) {
        note = '<p class="flag">Still converting to MP4. Plays on iPhone and Mac until it finishes.</p>';
      }
      media = '<div class="media"><video playsinline preload="metadata" controls src="'
        + esc(publicUrl(src)) + '"></video>' + note + '</div>';
    } else if (paths.length) {
      media = '<div class="media"><div class="strip2">'
        + paths.map(function (p) { return '<img loading="lazy" src="' + esc(publicUrl(p)) + '">'; }).join('')
        + '</div><div class="counter"><b>1</b> / ' + paths.length + '</div></div>';
    }

    /* inside a brand the card belongs to that brand, even if it was filed before tags existed */
    var shownBrand = brand === INBOX ? it.tag : brand;
    var th = THEME[shownBrand];
    if (it.note) card.classList.add('has-note');
    card.innerHTML = media
      + '<div class="slip">'
      + '<div class="meta">' + (shownBrand && th ? '<span class="bdot" style="--c:' + th.dot + '"></span>' + esc(shownBrand) : 'No brand yet')
      + '<span aria-hidden="true">\u00b7</span>' + (it.kind === 'video' ? 'Video' : paths.length + (paths.length === 1 ? ' slide' : ' slides')) + '</div>'
      + '<input class="title" aria-label="Title" value="' + esc(it.title) + '">'
      + '<div class="chips"><button type="button" class="dayset' + (it.day ? ' set' : '') + '">' + esc(it.day || 'Set day') + '</button>'
      + '<button type="button" class="capbtn' + (it.caption ? ' has' : '') + '">' + (it.caption ? 'Caption written' : 'Add caption') + '</button></div>'
      + '<div class="verdict" role="group" aria-label="Decision">'
      + '<button type="button" data-v="approved">Approve</button>'
      + '<button type="button" data-v="changes">Changes</button>'
      + '<button type="button" data-v="rejected">Reject</button></div>'
      + '<label class="notebox"><span class="nq">What should change?</span>'
      + '<textarea class="comment" rows="2" placeholder="Tell the designer">' + esc(it.note) + '</textarea></label>'
      + '<div class="actions">'
      + (brand === INBOX
          ? '<button type="button" class="move filebtn grow">' + esc(it.tag ? 'File to ' + it.tag : 'File it') + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'
          : '<button type="button" class="post grow">Mark as posted</button>')
      + '<button type="button" class="get icon" aria-label="Download"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>'
      + '<button type="button" class="more icon" aria-label="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>'
      + '<div class="postedrow"><span class="postedtag">Posted</span><button type="button" class="unpost">Undo</button></div>'
      + '</div>';

    var VERB = { approved: 'Approve', changes: 'Changes', rejected: 'Reject' };
    var DONE = { approved: 'Approved', changes: 'Changes asked', rejected: 'Rejected' };

    function paintVerdict() {
      card.querySelector('.nq').textContent = it.verdict === 'rejected' ? 'Why is it rejected?' : 'What should change?';
      card.querySelectorAll('.verdict button').forEach(function (o) {
        var mine = o.dataset.v === it.verdict;
        o.setAttribute('aria-pressed', String(mine));
        o.textContent = mine ? DONE[o.dataset.v] : VERB[o.dataset.v];
      });
    }

    card.querySelectorAll('.verdict button').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = it.verdict === b.dataset.v ? null : b.dataset.v;
        it.verdict = v;
        if (v) card.dataset.verdict = v; else card.removeAttribute('data-verdict');
        paintVerdict();
        setStamp(card, v, it.id, true);
        patch(it.id, { verdict: v }); tally();
      });
    });
    paintVerdict();
    setStamp(card, it.verdict, it.id, false);

    var dsel = card.querySelector('.dayset');
    dsel.addEventListener('click', function () {
      var opts = [{ label: 'No day', value: '' }].concat(DAYS.map(function (d) {
        return { label: SHORT[d], value: d };
      }));
      choose('Day to post', opts, it.day || '', { grid: true, kicker: it.title }).then(function (v) {
        if (v === null) return;
        it.day = v || null;
        patch(it.id, { day: it.day });
        items.sort(byDay); drawItems();
      });
    });

    var t = card.querySelector('.title');
    t.addEventListener('change', function () {
      it.title = t.value.trim(); patch(it.id, { title: it.title });
    });
    var capBtn = card.querySelector('.capbtn');
    capBtn.addEventListener('click', function () {
      captionSheet(it).then(function (v) {
        if (v === null || v === it.caption) return;
        it.caption = v; patch(it.id, { caption: v }); toast('Caption saved');
        capBtn.textContent = v ? 'Caption written' : 'Add caption';
        capBtn.classList.toggle('has', !!v);
      });
    });
    var note = card.querySelector('.comment');
    note.addEventListener('change', function () {
      it.note = note.value.trim(); patch(it.id, { note: it.note });
    });
    card.querySelector('.get').addEventListener('click', function () {
      if (!paths.length) { toast('Nothing to download'); return; }
      var base = safeName(it.title);
      if (paths.length === 1) {
        pull(paths[0], base + extOf(paths[0]));
        toast('Downloading');
        return;
      }
      /* browsers block a burst of downloads, so they go one at a time */
      toast('Downloading ' + paths.length + ' slides');
      paths.forEach(function (p, i) {
        setTimeout(function () {
          pull(p, base + ' ' + (i + 1) + extOf(p));
        }, i * 900);
      });
    });

    var mv = card.querySelector('.move');
    if (mv) mv.addEventListener('click', function () { moveItem(it); });

    var post = card.querySelector('.post') || document.createElement('button');
    function togglePosted() {
      it.posted = !it.posted;
      patch(it.id, { posted: it.posted });
      function apply() {
        card.dataset.posted = it.posted ? '1' : '0';
        tally();
      }
      if (it.posted && document.body.classList.contains('hideposted') && !REDUCE) {
        /* it is about to disappear from view, so let it leave instead of vanishing */
        card.classList.add('gone');
        setTimeout(function () { card.classList.remove('gone'); apply(); }, 260);
      } else {
        morph(card, apply);
      }
    }
    post.addEventListener('click', togglePosted);
    card.querySelector('.unpost').addEventListener('click', togglePosted);
    function removeIt() {
      confirmBox('Delete this?', 'This removes ' + (it.title || 'it') + ' and its files for everyone. It can\u2019t be undone.', 'Delete').then(function (yes) {
        if (!yes) return;
      busy(true);
      var dead = paths.slice();
      if (it.preview) dead.push(it.preview);
      var step = dead.length ? db.storage.from(BUCKET).remove(dead) : Promise.resolve({});
      step.then(function () { return db.from('items').delete().eq('id', it.id); })
        .then(function () {
          busy(false); toast('Deleted');
          if (REDUCE) { loadItems(); return; }
          card.classList.add('gone');
          setTimeout(loadItems, 260);
        })
        .catch(function (e) { busy(false); toast(String(e.message || e)); });
      });
    }
    card.querySelector('.more').addEventListener('click', function () {
      choose(it.title || 'Untitled', [
        { label: 'Download', value: 'get' },
        { label: it.posted ? 'Undo posted' : 'Mark as posted', value: 'post' },
        { label: 'Delete', value: 'drop', cls: 'warnopt' }
      ], null, { kicker: it.tag || 'No brand yet' }).then(function (v) {
        if (v === 'get') card.querySelector('.get').click();
        else if (v === 'post') togglePosted();
        else if (v === 'drop') removeIt();
      });
    });

    var strip = card.querySelector('.strip2');
    if (strip) {
      var out = card.querySelector('.counter b');
      strip.addEventListener('scroll', function () {
        out.textContent = Math.min(
          Math.round(strip.scrollLeft / strip.clientWidth) + 1, paths.length);
      }, { passive: true });
    }

    g.appendChild(card);
  });
  tally();
}

/* filing something from the inbox into a brand's week */
function moveItem(it) {
  var first = it.tag
    ? Promise.resolve(it.tag)
    : choose('Which brand?', BRANDS.map(function (b) {
        return { label: b.name, value: b.name }; }), null);
  first.then(function (target) {
    if (!target) return;
    return pickFolder(it, target);
  }).catch(function (e) { toast(String(e.message || e)); });
}

function pickFolder(it, target) {
  return db.from('folders').select('*').eq('brand', target)
    .order('created_at', { ascending: false }).then(function (r) {
      var weeks = (r.data || []);
      var list = weeks.map(function (f) {
        return { label: f.name, value: f.id }; });
      list.push({ label: 'Make a new week', value: '__new__', cls: 'dashed' });
      list.push({ label: 'Wrong brand? File it somewhere else', value: '__brand__', cls: 'dashed' });
      return choose('File to ' + target, list, null, { kicker: it.title }).then(function (pick) {
        if (!pick) return;
        if (pick === '__brand__') {
          return choose('Which brand?', BRANDS.map(function (b) {
            return { label: b.name, value: b.name }; }), target, { kicker: it.title }).then(function (other) {
            if (other) return pickFolder(it, other);
          });
        }
        if (pick !== '__new__') return finishMove(it, pick, target);
        return ask('New week in ' + target, 'Name it for the week', 'Week ' + (weeks.length + 1), 'Create')
          .then(function (name) {
            if (!name) return;
            return db.from('folders').insert({ brand: target, name: name }).select().single()
              .then(function (ins) {
                if (ins.error) throw ins.error;
                return finishMove(it, ins.data.id, target);
              });
          });
      });
    });
}

function finishMove(it, fid, target) {
  var opts = [{ label: 'No day', value: '' }].concat(DAYS.map(function (d) {
    return { label: SHORT[d], value: d }; }));
  return choose('Which day?', opts, it.day || '', { grid: true, kicker: it.title }).then(function (day) {
    if (day === null) return;
    busy(true);
    return db.from('items').update({ folder_id: fid, day: day || null, tag: target })
      .eq('id', it.id)
      .then(function (r) {
        busy(false);
        if (r.error) { toast(r.error.message); return; }
        var card = document.querySelector('.card[data-id="' + it.id + '"]');
        if (card && !REDUCE) { card.classList.add('gone'); setTimeout(loadItems, 260); } else loadItems();
        toast('Filed to ' + target + (day ? ', ' + day : ''));
      });
  });
}

/* ---------- tally and copy ---------- */
function tally() {
  var live = folderId ? items : [];
  function n(f) { return live.filter(f).length; }
  var ok = n(function (i) { return i.verdict === 'approved'; });
  var ch = n(function (i) { return i.verdict === 'changes'; });
  var no = n(function (i) { return i.verdict === 'rejected'; });
  var open = n(function (i) { return !i.verdict; });
  var stats = brand === INBOX
    ? [[open, 'to decide'], [ok, 'approved'], [ch + no, 'sent back']]
    : [[n(function (i) { return i.verdict === 'approved' && !i.posted; }), 'ready to post'],
       [n(function (i) { return i.posted; }), 'posted'], [ch + no, 'need work']];
  el('stats').innerHTML = stats.map(function (x) {
    return '<div class="stat"><b class="disp">' + x[0] + '</b><span>' + x[1] + '</span></div>';
  }).join('');
  el('tally').innerHTML = live.length
    ? '<span><i style="--c:#35D683"></i>' + ok + ' approved</span>'
      + '<span><i style="--c:#F2A81E"></i>' + ch + ' changes</span>'
      + '<span><i style="--c:#FF5A4F"></i>' + no + ' rejected</span>'
      + '<span><i class="hollow"></i>' + open + ' to go</span>'
    : '<span>Nothing to review</span>';
  if (brand === INBOX) setWaiting(open);
}

/* the favicon and tab title show how much is waiting in New */
var waitingCount = 0, inboxIdCache = null;
function faviconSvg(dot) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1A1716"/>'
    + '<g transform="rotate(-10 32 32)" fill="none" stroke="#35D683" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect x="10" y="10" width="44" height="44" rx="10" stroke-width="5"/><path d="M21 32.5l7.5 7.5 14-16" stroke-width="7"/></g>'
    + (dot ? '<circle cx="48" cy="16" r="15" fill="#FF5A4F" stroke="#1A1716" stroke-width="4"/>' : '') + '</svg>';
}
function setWaiting(n) {
  var changed = n !== waitingCount;
  waitingCount = n;
  document.title = (n > 0 ? '(' + n + ') ' : '') + 'Content approvals';
  el('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(faviconSvg(n > 0));
  el('mark').classList.toggle('waiting', n > 0);
  if (changed) {
    var b = el('tabs').querySelector('button');
    if (b) {
      var badge = b.querySelector('.badge');
      if (n > 0 && !badge) { badge = document.createElement('span'); badge.className = 'badge'; b.appendChild(badge); }
      if (badge) { if (n > 0) badge.textContent = n; else badge.remove(); }
    }
  }
}
function countWaiting() {
  if (!db || brand === INBOX) return;
  var go = inboxIdCache ? Promise.resolve(inboxIdCache)
    : db.from('folders').select('id').eq('brand', INBOX).order('created_at', { ascending: true }).limit(1)
        .then(function (r) { inboxIdCache = r.data && r.data[0] ? r.data[0].id : null; return inboxIdCache; });
  go.then(function (id) {
    if (!id) { setWaiting(0); return; }
    return db.from('items').select('id,verdict').eq('folder_id', id).then(function (r) {
      if (r.error) return;
      setWaiting((r.data || []).filter(function (x) { return !x.verdict; }).length);
    });
  }).catch(function () {});
}
/* home-screen icon for phones, drawn once */
(function () {
  try {
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas'); c.width = c.height = 180;
      c.getContext('2d').drawImage(img, 0, 0, 180, 180);
      el('touchicon').href = c.toDataURL('image/png');
    };
    img.src = 'data:image/svg+xml,' + encodeURIComponent(faviconSvg(false));
  } catch (e) {}
})();

function copy(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast(msg); },
      function () { fallback(text, msg); });
  } else fallback(text, msg);
}
function fallback(text, msg) {
  var a = document.createElement('textarea');
  a.value = text; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select(); a.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); toast(msg); } catch (e) { toast('Copy failed'); }
  document.body.removeChild(a);
}

el('copy').addEventListener('click', function () {
  var folder = folders.filter(function (f) { return f.id === folderId; })[0];
  var lines = [brand + (folder ? ' \u2014 ' + folder.name : ''), ''];
  items.forEach(function (it) {
    var v = it.posted ? 'POSTED' : (it.verdict ? it.verdict.toUpperCase() : 'NOT DECIDED');
    lines.push('\u2022 ' + (it.day ? it.day + ': ' : '') + (it.title || 'Untitled')
      + ' \u2014 ' + v + (it.note ? ' (' + it.note + ')' : ''));
  });
  copy(lines.join('\n'), 'Decisions copied');
});

el('hidePosted').addEventListener('click', function () {
  var on = el('hidePosted').getAttribute('aria-checked') !== 'true';
  el('hidePosted').setAttribute('aria-checked', String(on));
  document.body.classList.toggle('hideposted', on);
});

/* ---------- boot ---------- */
try {
  var savedBrand = localStorage.getItem('ab:brand');
  if (savedBrand && (savedBrand === INBOX || BRANDS.some(function (b) { return b.name === savedBrand; }))) brand = savedBrand;
  if (localStorage.getItem('ab:ok')) unlock();
} catch (e) {}
</script></body></html>
